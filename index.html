<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Quầy Sức Khỏe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Baloo+2:wght@700;800&display=swap">
<style>
  :root {
    --paper:#F5F3EA; --surface:#FFFFFF; --surface-2:#EAE5D4; --surface-3:#DFD8C1;
    --ink:#1B1F17; --ink-2:#43493A; --ink-3:#6C7160;
    --line:#DCD7C2; --line-2:#B7B096;
    --la:#255A3E; --la-2:#184330; --la-soft:#E3EEE5; --la-tint:#F0F5EE;
    --vang:#93690A; --vang-soft:#F8EACB;
    --do:#943229; --do-soft:#F6E1DC;
    --shell:#173521; --shell-2:#0E2216; --shell-ink:#E9F0EA; --shell-dim:#8DAE9A; --shell-hi:#254A34;
    --sh:0 1px 2px rgba(27,31,23,.05),0 8px 22px -14px rgba(27,31,23,.4);
    --sh2:0 4px 10px rgba(27,31,23,.08),0 30px 60px -24px rgba(27,31,23,.45);
    --r:10px; --rl:16px;
    --serif:"Fraunces","Noto Serif","Liberation Serif",serif;
    --bubble:"Baloo 2","Noto Sans",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#12160F; --surface:#1A1F17; --surface-2:#232920; --surface-3:#2E3527;
    --ink:#EEEDE1; --ink-2:#C4C5B4; --ink-3:#8F9384;
    --line:#31372A; --line-2:#4A5140;
    --la:#8FCBA3; --la-2:#ABDCBB; --la-soft:#1E2C22; --la-tint:#1A2620;
    --vang:#E0BA5E; --vang-soft:#33290F;
    --do:#E5897A; --do-soft:#38221D;
    --shell:#0E1D14; --shell-2:#08120C; --shell-ink:#DCE7DF; --shell-dim:#7DA08C; --shell-hi:#1D3728;
    --sh:0 1px 2px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.85);
    --sh2:0 4px 12px rgba(0,0,0,.55),0 34px 68px -28px rgba(0,0,0,1);
  }}
  :root[data-theme="dark"]{
    --paper:#12160F; --surface:#1A1F17; --surface-2:#232920; --surface-3:#2E3527;
    --ink:#EEEDE1; --ink-2:#C4C5B4; --ink-3:#8F9384;
    --line:#31372A; --line-2:#4A5140;
    --la:#8FCBA3; --la-2:#ABDCBB; --la-soft:#1E2C22; --la-tint:#1A2620;
    --vang:#E0BA5E; --vang-soft:#33290F;
    --do:#E5897A; --do-soft:#38221D;
    --shell:#0E1D14; --shell-2:#08120C; --shell-ink:#DCE7DF; --shell-dim:#7DA08C; --shell-hi:#1D3728;
    --sh:0 1px 2px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.85);
    --sh2:0 4px 12px rgba(0,0,0,.55),0 34px 68px -28px rgba(0,0,0,1);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,"Noto Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:0}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  h1,h2{font-family:var(--serif)}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit}
  .num{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  ::selection{background:var(--la);color:#fff}

  /* ===== khung ===== */
  #shell{display:flex;min-height:100vh}
  nav#side{flex:none;width:206px;background:linear-gradient(175deg,var(--shell),var(--shell-2));color:var(--shell-ink);padding:18px 0 22px;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:2px 0 0 rgba(0,0,0,.08)}
  #side .brand{padding:2px 18px 16px;margin-bottom:8px}
  #side .brand b{display:block;font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:-.01em;color:#fff}
  #side .brand small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--shell-dim);margin-top:4px;text-transform:uppercase}
  #side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;font-size:13.5px;font-weight:500;color:var(--shell-dim);padding:9px 18px;cursor:pointer;position:relative;transition:color .12s,background .12s}
  #side button .ic{flex:none;width:17px;height:17px;opacity:.85}
  #side button .ic svg{width:100%;height:100%;display:block}
  #side button:hover{color:#fff;background:rgba(255,255,255,.055)}
  #side button.on{background:rgba(255,255,255,.09);color:#fff;font-weight:700}
  #side button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--vang)}
  #side .grp{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--shell-dim);opacity:.6;padding:16px 18px 6px;font-weight:700}
  #side .who{margin:16px 14px 0;padding:12px 13px;background:rgba(0,0,0,.24);border-radius:10px;border:1px solid rgba(255,255,255,.06)}
  #side .who b{display:block;font-size:13.5px;color:#fff}
  #side .who span{font-size:11px;color:var(--shell-dim)}
  #side .who button{padding:7px 0 0;font-size:11px;color:var(--shell-dim);border:0;text-decoration:underline;background:none}

  main{flex:1 1 auto;min-width:0;padding:26px 32px 80px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .top h2{font-size:27px;flex:1 1 auto}
  .top .sub{font-size:13px;color:var(--ink-3);width:100%;margin-top:-10px}

  /* ===== nut ===== */
  .b{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 15px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s,transform .06s}
  .b:hover{border-color:var(--ink-3);background:var(--surface-2)}
  .b:active{transform:translateY(1px)}
  .b.pri{background:var(--la);border-color:var(--la);color:#fff}
  .b.pri:hover{background:var(--la-2);border-color:var(--la-2)}
  .b.warn{background:var(--vang-soft);border-color:var(--vang);color:var(--vang)}
  .b.dg{background:var(--do-soft);border-color:var(--do);color:var(--do)}
  .b.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
  .b:disabled{opacity:.45;cursor:not-allowed}
  .b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--vang);outline-offset:2px}

  /* ===== the ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
  .card>h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
  .kpi:hover{border-left-color:var(--la);box-shadow:var(--sh)}
  .kpi .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:3px;color:var(--ink)}
  .kpi .d{font-size:11.5px;color:var(--ink-3)}
  .kpi.hl{border-left-color:var(--vang);background:var(--vang-soft)}

  /* ===== bang ===== */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:11px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--la-tint)}
  td.r,th.r{text-align:right}
  td b{color:var(--ink)}

  /* ===== nhan ===== */
  .ch{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;letter-spacing:.01em}
  .ch.ok{background:var(--la-soft);color:var(--la)}
  .ch.wn{background:var(--vang-soft);color:var(--vang)}
  .ch.bd{background:var(--do-soft);color:var(--do)}
  .ch.n{background:var(--surface-3);color:var(--ink-2)}
  .fam{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 10px 3px 8px;border-radius:6px;background:var(--la-soft);color:var(--la);border:1px solid var(--la);white-space:nowrap;cursor:pointer}
  .fam::before{content:"\2302";font-size:12.5px;line-height:1}

  /* ===== form ===== */
  .f{display:grid;gap:13px}
  .f label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);transition:border-color .12s}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--la)}
  .f textarea{min-height:70px;resize:vertical}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px}
  .srch{flex:1 1 220px;min-width:150px;padding:10px 13px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
  .fil{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
  .fil button{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .fil button.on{background:var(--la);border-color:var(--la);color:#fff}

  /* ===== dong ===== */
  .rl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
  .rl:last-child{border-bottom:0}
  .rl .nm{flex:1 1 auto;color:var(--ink);font-weight:600;min-width:0}
  .rl .mut{color:var(--ink-3);font-weight:400;font-size:12.5px}
  .tick{width:27px;height:27px;border-radius:7px;border:2px solid var(--line-2);flex:none;background:var(--surface);cursor:pointer;position:relative;padding:0;transition:background .1s,border-color .1s}
  .tick.on{background:var(--la);border-color:var(--la)}
  .tick.on::after{content:"\2713";color:#fff;font-size:16px;font-weight:700;position:absolute;inset:0;display:grid;place-items:center}

  /* ===== modal ===== */
  #ov{position:fixed;inset:0;background:rgba(14,18,12,.6);backdrop-filter:blur(1px);display:grid;place-items:center;padding:18px;z-index:80}
  #ov .mo{background:var(--paper);border-radius:var(--rl);box-shadow:var(--sh2);width:min(640px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
  #ov .mh{display:flex;align-items:center;gap:12px;padding:19px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
  #ov .mh h3{font-size:20px;flex:1 1 auto}
  #ov .mb{padding:22px 24px}
  #ov .mf{display:flex;gap:8px;justify-content:flex-end;padding:15px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}
  .x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 4px}

  /* ===== toast ===== */
  #tt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  #tt div{background:var(--shell);color:#fff;padding:12px 22px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:var(--sh2);max-width:86vw}
  #tt div.bad{background:var(--do);color:#fff}

  .empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
  .empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:18px;margin-bottom:6px;font-weight:700}
  .warn{background:var(--vang-soft);border-left:4px solid var(--vang);border-radius:0 8px 8px 0;padding:15px 19px;margin-bottom:16px;font-size:14px;color:var(--ink-2)}
  .warn b{color:var(--ink)}
  .bad{background:var(--do-soft);border-left:4px solid var(--do)}
  .spark{display:flex;align-items:flex-end;gap:4px;height:52px}
  .spark i{flex:1;background:var(--la-soft);border-radius:3px 3px 0 0;min-height:2px}
  .spark i.hi{background:var(--la)}

  /* ===== dang nhap ===== */
  #gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--surface-2)}
  #gate .bx{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh2);padding:28px 30px 30px}
  #gate .seg{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
  #gate .seg button{font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-3);cursor:pointer}
  #gate .seg button.on{background:var(--vang-soft);border-color:var(--vang);color:var(--ink)}
  #gate .gbrand{text-align:center;margin-bottom:20px}
  #gate .gbrand span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:6px}

  /* ===== logo chu bong bong ===== */
  .qlogo{font-family:var(--bubble);user-select:none}
  .qlogo .row{display:flex!important;flex-direction:row!important;flex-wrap:nowrap;justify-content:center;align-items:baseline;gap:1px}
  .qlogo .row+.row{margin-top:3px}
  .qlogo .row span{display:inline-block;font-weight:800;-webkit-text-stroke:3px #fff;paint-order:stroke fill;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));line-height:1}
  .qlogo.lg .row span{font-size:44px}
  .qlogo.sm .row span{font-size:18px;-webkit-text-stroke:1.6px #fff;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .qlogo .accent{font-size:.5em!important;-webkit-text-stroke:0!important;filter:none!important;align-self:flex-end}
  #gate .who{display:grid;gap:9px;margin-bottom:6px}
  #gate .who button{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 15px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
  #gate .who button:hover{border-color:var(--la);background:var(--la-tint)}
  #gate .who b{display:block;font-size:15px}
  #gate .who span{font-size:12px;color:var(--ink-3)}
  #gate .b.pri{width:100%;justify-content:center;padding:12px 16px;font-size:14.5px}
  #gate .foot{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:16px}
  .pin{letter-spacing:.6em;text-align:center;font-size:22px!important;font-weight:700}

  /* ===== in ===== */
  #pr{display:none}
  @media print{
    body{background:#fff;color:#000}
    #shell,#ov,#tt,#gate,#boot{display:none!important}
    #pr{display:block!important;padding:0;font-family:"Times New Roman",serif}
    #pr h1{font-size:26px;margin-bottom:2px}
    #pr .m{font-size:13px;color:#444;margin-bottom:16px}
    #pr table{width:100%;border-collapse:collapse;font-size:13px}
    #pr th,#pr td{border:1px solid #999;padding:7px 9px;text-align:left}
    #pr th{background:#eee}
    #pr .ft{margin-top:22px;font-size:11px;color:#555;border-top:1px solid #999;padding-top:10px}
  }

  @media (max-width:860px){
    #shell{flex-direction:column}
    nav#side{position:static;width:100%;height:auto;display:flex;flex-wrap:wrap;gap:2px;padding:12px;box-shadow:none}
    #side .brand,#side .grp,#side .who{display:none}
    #side button{width:auto;padding:8px 13px;border-radius:8px}
    #side button.on::before{left:8px;right:8px;top:auto;bottom:2px;height:3px;width:auto;border-radius:3px}
    main{padding:18px 16px 60px}
    .grid2{grid-template-columns:1fr}
  }
</style>


<div id="gate" hidden></div>
<div id="shell" hidden>
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="boot" style="min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center">
  <div>
    <div style="font-size:20px;font-weight:700;letter-spacing:-.02em">Quầy Sức Khỏe</div>
    <div style="font-size:13.5px;color:var(--ink-3);margin-top:6px">Đang mở kho dữ liệu...</div>
  </div>
</div>
<div id="ov" hidden></div>
<div id="tt"></div>
<div id="pr"></div>

/* ========== lop db ========== */
function ready(){return !!S.db}
function docRef(p){return S.db.doc(p)}
function colRef(p){return S.db.collection(p)}

function save(path,data){
  if(!ready())return Promise.reject({code:'not_granted'});
  return docRef(path).set(data);
}
function patch(path,data){
  if(!ready())return Promise.reject({code:'not_granted'});
  return docRef(path).update(data).catch(function(e){
    if(e&&(e.code==='not-found'||e.code==='invalid_argument'||e.code==='invalid-argument'))return docRef(path).set(data);
    throw e;
  });
}
function dbErr(e){
  var c=e&&e.code||'unavailable';
  var m={'invalid-argument':'Dữ liệu không hợp lệ, chưa lưu được.',
    'resource-exhausted':'Hệ thống đang bận, thử lại sau một chút.',
    'permission-denied':'Không có quyền truy cập dữ liệu này. Kiểm tra lại Firestore Rules.',
    'unauthenticated':'Phiên đăng nhập đã hết, hãy tải lại trang.',
    'unavailable':'Mất kết nối tới kho dữ liệu, thử lại.',
    'not-found':'Không tìm thấy dữ liệu.'};
  toast(m[c]||'Không lưu được, thử lại.',true);
  return null;
}

/* ========== tai file ve may (thay cho window.claude.use('downloads')) ========== */
function downloadsShim(){
  return {
    save:function(opts){
      return new Promise(function(resolve,reject){
        try{
          var data=opts&&opts.data;
          var blob=(typeof Blob!=='undefined'&&data instanceof Blob)?data:new Blob([data],{type:'text/plain;charset=utf-8'});
          var url=URL.createObjectURL(blob);
          var a=document.createElement('a');
          a.href=url;a.download=(opts&&opts.filename)||'tep-tai-ve';
          document.body.appendChild(a);a.click();document.body.removeChild(a);
          setTimeout(function(){URL.revokeObjectURL(url)},1500);
          resolve();
        }catch(e){reject(e)}
      });
    }
  };
}

function boot(){

  if(!firebaseConfig||firebaseConfig.apiKey==='ĐIỀN_API_KEY'){
    offline('Chưa điền cấu hình Firebase. Mở file index.html, tìm biến "firebaseConfig" ở gần đầu file và điền thông tin lấy từ Firebase Console (Project settings → Your apps).');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
  }catch(e){offline('Không khởi tạo được Firebase: '+(e&&e.message||''));return}
  firebase.auth().signInAnonymously().then(function(){
    S.db=firebase.firestore();
    S.dl=downloadsShim();
    subscribe();
  }).catch(function(e){
    offline('Không đăng nhập được vào kho dữ liệu: '+(e&&e.message||'')+'. Kiểm tra đã bật "Anonymous" trong Firebase Authentication → Sign-in method chưa.');

}

function subscribe(){
  S.subs.forEach(function(u){try{u()}catch(e){}});S.subs=[];
  var got={cfg:false,staff:false,mem:false,pro:false,cand:false,evt:false,fb:false,day:false};
  function tick(k){got[k]=true;if(got.cfg&&got.staff&&got.mem&&got.pro&&got.cand&&got.evt&&got.fb&&got.day){$('#boot').hidden=true;render()}}

  S.subs.push(docRef('meta/config').onSnapshot(function(s){
    S.cfg=s.exists?s.data():null;tick('cfg');render();
  },dbErr));

  S.subs.push(colRef('staff').onSnapshot(function(q){
    S.staff=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('staff');render();
  },dbErr));

  S.subs.push(colRef('members').onSnapshot(function(q){
    S.members=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    S.members.sort(function(a,b){return kd(a.ten).localeCompare(kd(b.ten))});
    tick('mem');render();
  },dbErr));

  S.subs.push(colRef('products').onSnapshot(function(q){
    S.products=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('pro');render();
  },dbErr));

  S.subs.push(colRef('candidates').onSnapshot(function(q){
    S.candidates=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('cand');render();
  },dbErr));

  S.subs.push(colRef('events').onSnapshot(function(q){
    S.events=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    S.events.sort(function(a,b){return a.ngay<b.ngay?-1:1});
    tick('evt');render();
  },dbErr));

  S.subs.push(colRef('feedback').onSnapshot(function(q){
    S.feedback=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});

  },dbErr));

}

/* ========== MAT KHAU: bam don gian bang SubtleCrypto ========== */
function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function sha256hex(s){
  var enc=new TextEncoder().encode(s);
  return crypto.subtle.digest('SHA-256',enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  });
}
function hashPw(pw,salt){return sha256hex(salt+':'+pw)}

function vungCua(c,v){
  if(c.lo==null||v==null)return {t:'Đã ghi',c:'n'};
  if(v<c.lo)return {t:'Dưới ngưỡng',c:'bd'};
  if(v>c.hi)return {t:'Trên ngưỡng',c:'wn'};
  return {t:'Trong ngưỡng',c:'ok'};
}
function timeline(x){
  var out=[];
  (x.doLan||[]).forEach(function(d){out.push({s:d.ngay,d:dmy(d.ngay),t:'Đo '+((BODO[d.bo]||{}).ten||''),ai:d.nguoiDo})});
  (x.tapLuc||[]).slice(-15).forEach(function(d){out.push({s:d,d:dmy(d),t:'Đi tập'})});
  (x.miTx||[]).forEach(function(r){if(r.tu==='Bán hàng')out.push({s:r.ngay,d:dmy(r.ngay),t:r.viec})});
  (x.ghiChu||[]).forEach(function(g){out.push({s:g.g.slice(0,10),d:dmy(g.g.slice(0,10)),t:g.t,ai:g.ai})});
  out.sort(function(a,b){return a.s<b.s?1:a.s>b.s?-1:0});
  return out;
}

    style:'width:100%;min-height:64px;padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)'}));
  m.appendChild(goiY);

  act.appendChild(btn('Huỷ',function(){go('member',x.id)}));

  act.appendChild(btn('Lưu, không in',function(){luuDo(false)}));
  m.appendChild(act);

  function luuDo(inRa){
    var cs={},co=0;
    card.querySelectorAll('input[data-k]').forEach(function(i){
      var v=parseFloat(i.value);
      if(isFinite(v)){cs[i.getAttribute('data-k')]=v;co++}
    });
    if(!co)return toast('Chưa nhập chỉ số nào',true);
    var ban={ngay:S.dayId,bo:boK,cs:cs,nguoiDo:S.me.ten};
    var doLan=[ban].concat(x.doLan||[]).slice(0,80);
    var gc=x.ghiChu||[];
    var note=$('#do_gc').value.trim();
    if(note)gc=[{g:new Date().toISOString(),ai:S.me.ten,t:note}].concat(gc).slice(0,60);
    patch('members/'+x.id,{doLan:doLan,ghiChu:gc}).then(function(){

      toast('Đã lưu buổi đo');
      if(inRa)inToKetQua(x,ban,truoc);
      go('member',x.id);
    }).catch(dbErr);

function inToKetQua(x,lan,truoc){
  var bo=BODO[lan.bo]||BODO.vienman;
  var rows=bo.ct.filter(function(c){return lan.cs[c.k]!=null}).map(function(c){
    var v=lan.cs[c.k],p=truoc&&truoc.cs?truoc.cs[c.k]:null;
    var ch=(p!=null)?(v-p):null;
    var vg=vungCua(c,v);
    return '<tr><td>'+esc(c.t)+'</td><td>'+num(v,c.d)+' '+esc(c.u)+'</td><td>'+(p!=null?num(p,c.d):'')+'</td><td>'+(ch===null?'':(ch>0?'+':'')+num(ch,c.d))+'</td><td>'+esc(vg.t)+'</td></tr>';
  }).join('');
  $('#pr').innerHTML='<h1>Kết quả đo sức khỏe</h1>'+
    '<div class="m">'+esc((S.cfg&&S.cfg.tenDiem)||'Quầy Sức Khỏe')+' · '+esc(x.ten)+
    (x.namSinh?' · sinh '+esc(x.namSinh):'')+' · ngày '+dmy(lan.ngay)+'</div>'+
    '<table><thead><tr><th>Chỉ số</th><th>Lần này</th><th>Lần trước'+(truoc?' '+dmy(truoc.ngay):'')+'</th><th>Chênh</th><th>Vùng</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="ft">Chuyên viên đo: '+esc(lan.nguoiDo||'')+'. '+
    'Quầy Sức Khỏe là nơi đo chỉ số, hướng dẫn vận động và tư vấn chăm sóc sức khỏe. '+
    'Quầy không phải cơ sở khám chữa bệnh và không thay thế chỉ định của bác sĩ.<br>'+
    esc((S.cfg&&S.cfg.diaChi)||'')+'</div>';
  setTimeout(function(){window.print()},60);
}

  var c2=E('div',{'class':'card'});c2.appendChild(E('h3',null,'Chưa đến · '+chuaDen.length));
  var s=E('input',{'class':'srch',placeholder:'Tìm nhanh trong danh sách',style:'margin-bottom:10px',oninput:function(e){
    var q=kd(e.target.value);

  });
  g.appendChild(c2);

  if((lop.tapThu||[]).length){
    var c3=E('div',{'class':'card'});c3.appendChild(E('h3',null,'Khách tập thử hôm nay'));

      r.appendChild(E('span',{'class':'nm'},esc(tt.ten)+' <span class="mut">'+esc(tt.sdt||'')+'</span>'));

      esc(nguyCo.slice(0,8).map(function(x){return x.ten}).join(', '))+(nguyCo.length>8?'...':'')));
    c4.appendChild(btn('Giao việc chăm sóc',function(){
      ghiNhatKy('Giao việc chăm sóc '+nguyCo.length+' người vắng nhiều',S.me.ten,'');
      toast('Đã ghi vào nhật ký, người trực gọi khách ngoài hệ thống');
    },'warn'));

  function toggle(id,them){
    var cur=((S.day.lop||{})[lopId]||{}).coMat||[];
    var arr=cur.slice();
    var i=arr.indexOf(id);
    if(them&&i<0)arr.push(id);
    if(!them&&i>=0)arr.splice(i,1);
    setLop(lopId,{coMat:arr,hlv:lop.hlv||S.me.ten});
    var x=mById(id);
    if(x){
      var tl=(x.tapLuc||[]).slice();
      var j=tl.indexOf(S.dayId);
      if(them&&j<0)tl.push(S.dayId);
      if(!them&&j>=0)tl.splice(j,1);
      patch('members/'+id,{tapLuc:tl.slice(-400)}).catch(function(){});
    }
    ghiNhatKy((them?'Tích có mặt lớp ':'Bỏ tích lớp ')+(lopId==='sang'?'sáng':'chiều'),S.me.ten,x?x.ten:'');

function vangMayBuoi(x){
  var a=x.tapLuc||[];if(!a.length)return 99;
  var last=a[a.length-1];
  for(var i=0;i<a.length;i++)if(a[i]>last)last=a[i];
  return daysBetween(last,ymd());
}
function setLop(ca,patchObj){
  var lop=Object.assign({},(S.day&&S.day.lop)||{});

}

function vSell(m){
  var khach=S.sellFor?mById(S.sellFor):null;
  head(m,'Bán hàng tại quầy',null,[
    btn(khach?'Đổi khách':'Chọn khách',function(){chonKhach(function(id){S.sellFor=id;render()})}),
    S.cart.length?btn('Xoá giỏ',function(){S.cart=[];render()},'dg'):null
  ]);
  m.appendChild(E('div',{style:'font-size:13.5px;color:var(--ink-3);margin:-12px 0 16px'},
    khach?('Đơn cho <b style="color:var(--ink)">'+esc(khach.ten)+'</b> · '+esc(khach.theLoai?GIA[khach.theLoai].ten:'chưa có thẻ')+' · đang có <span class="num">'+num(khach.diemMi||0)+'</span> điểm Mi'):'Chưa gắn khách. Gắn hồ sơ để tích điểm Mi và ghi vào lịch sử khách.'));

  var g=E('div',{'class':'grid2'});
  var c1=E('div',{'class':'card'});c1.appendChild(E('h3',null,'Chọn hàng'));
  var s=E('input',{'class':'srch',placeholder:'Tìm sản phẩm',style:'margin-bottom:10px',oninput:function(e){
    var q=kd(e.target.value);
    c1.querySelectorAll('[data-pn]').forEach(function(el){el.hidden=q&&kd(el.getAttribute('data-pn')).indexOf(q)<0});
  }});
  c1.appendChild(s);
  S.products.forEach(function(p){
    var het=(p.tonKho||0)<=0;
    var thieu=hoSoThieu(p).length>0;
    var r=E('div',{'class':'rl','data-pn':p.ten,style:het?'opacity:.45':''});
    r.appendChild(E('span',{'class':'nm'},esc(p.ten)+'<br><span class="mut">'+vnd(p.giaBan)+' · tồn '+(p.tonKho||0)+(thieu?' · <span style="color:var(--do)">thiếu giấy tờ</span>':'')+'</span>'));
    r.appendChild(E('button',{'class':'b sm'+(het?'':' pri'),disabled:het?'':null,onclick:function(){
      if(het)return;
      if(thieu)toast('Mặt hàng này đang thiếu giấy tờ, kiểm tra ở mục Sản phẩm',true);
      themGio(p);
    }},het?'Hết hàng':'Thêm'));
    c1.appendChild(r);
  });
  if(!S.products.length)c1.appendChild(E('div',{'class':'empty'},'<b>Chưa có sản phẩm</b>Vào mục Sản phẩm để thêm.'));
  g.appendChild(c1);

  var tam=S.cart.reduce(function(a,i){return a+i.gia*i.sl},0);
  var maxDiem=khach?Math.min(khach.diemMi||0,tam):0;
  var dungDiem=Math.min(S.dungDiem||0,maxDiem);
  var phaiTra=Math.max(0,tam-dungDiem);
  var tichVe=Math.round(phaiTra*TICH_MI);

  var c2=E('div',{'class':'card'});c2.appendChild(E('h3',null,'Giỏ hàng và thanh toán'));
  if(!S.cart.length)c2.appendChild(E('div',{style:'color:var(--ink-3);font-size:14px;padding:8px 0'},'Giỏ đang trống.'));
  S.cart.forEach(function(i,idx){
    var r=E('div',{'class':'rl'});
    r.appendChild(E('span',{'class':'nm'},esc(i.ten)+'<br><span class="mut">'+vnd(i.gia)+' mỗi cái</span>'));
    var qty=E('div',{style:'display:flex;align-items:center;gap:6px'});
    qty.appendChild(E('button',{'class':'b sm',onclick:function(){i.sl--;if(i.sl<=0)S.cart.splice(idx,1);render()}},'−'));
    qty.appendChild(E('span',{'class':'num',style:'min-width:22px;text-align:center;font-weight:700'},String(i.sl)));
    qty.appendChild(E('button',{'class':'b sm',onclick:function(){var p=pById(i.id);if(p&&i.sl>=(p.tonKho||0))return toast('Không đủ tồn kho',true);i.sl++;render()}},'+'));
    r.appendChild(qty);
    r.appendChild(E('span',{'class':'num',style:'min-width:88px;text-align:right;font-weight:700'},vnd(i.gia*i.sl)));
    c2.appendChild(r);
  });
  if(S.cart.length){
    var sum=E('div',{style:'margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)'});
    sum.appendChild(dong('Tạm tính',vnd(tam)));
    if(khach&&maxDiem>0){
      var rd=E('div',{'class':'rl'});
      rd.appendChild(E('span',{'class':'nm',style:'font-weight:400'},'Dùng điểm Mi <span class="mut">tối đa '+num(maxDiem)+'</span>'));
      var inp=E('input',{type:'number',min:'0',max:String(maxDiem),step:'1000',value:String(dungDiem),
        style:'width:120px;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)',
        oninput:function(e){S.dungDiem=Math.max(0,Math.min(maxDiem,Math.round(Number(e.target.value)||0)));render()}});
      rd.appendChild(inp);
      sum.appendChild(rd);
      if(dungDiem>0)sum.appendChild(dong('Trừ điểm','<span style="color:var(--la)">−'+vnd(dungDiem)+'</span>',1));
    }
    sum.appendChild(dong('<b style="font-size:16px">Phải trả</b>','<b style="font-size:18px">'+vnd(phaiTra)+'</b>',1));
    if(khach)sum.appendChild(dong('Tích 10% sau đơn','<span class="ch ok">+'+num(tichVe)+' Mi</span>',1));
    sum.appendChild(dong('Hoá đơn và phiếu xuất','<span class="ch n">Xuất file cho kế toán</span>',1));
    c2.appendChild(sum);
    var pay=E('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:14px'});
    ['Tiền mặt','Chuyển khoản'].forEach(function(h){
      pay.appendChild(E('button',{'class':'b'+(S.hinhThuc===h?' warn':''),onclick:function(){S.hinhThuc=h;render()}},esc(h)));
    });
    pay.appendChild(E('button',{'class':'b pri',style:'flex:1;justify-content:center',onclick:chotDon},'Thu tiền và ghi đơn'));
    c2.appendChild(pay);
  }
  g.appendChild(c2);
  m.appendChild(g);

  function dong(l,v,plain){
    var r=E('div',{'class':'rl'});
    r.appendChild(E('span',{'class':'nm',style:plain?'font-weight:400':''},l));
    r.appendChild(E('span',{'class':'num'},v));
    return r;
  }
  function themGio(p){
    for(var i=0;i<S.cart.length;i++)if(S.cart[i].id===p.id){
      if(S.cart[i].sl>=(p.tonKho||0))return toast('Không đủ tồn kho',true);
      S.cart[i].sl++;render();return;
    }
    S.cart.push({id:p.id,ten:p.ten,gia:p.giaBan||0,sl:1});render();
  }
  function chotDon(){
    if(!S.cart.length)return toast('Giỏ đang trống',true);
    if(!S.hinhThuc)return toast('Chọn tiền mặt hay chuyển khoản',true);
    var don={ma:uid('dh'),g:nowHM(),ngay:S.dayId,khachId:khach?khach.id:'',khachTen:khach?khach.ten:'',
      items:S.cart.map(function(i){return {id:i.id,ten:i.ten,gia:i.gia,sl:i.sl}}),
      tam:tam,dungDiem:dungDiem,phaiTra:phaiTra,hinhThuc:S.hinhThuc,nguoiBan:S.me.ten,misaXuat:false};
    var ds=(S.day.donHang||[]).concat([don]);
    var jobs=[patch('days/'+S.dayId,{donHang:ds,ngay:S.dayId})];
    S.cart.forEach(function(i){
      var p=pById(i.id);
      if(p)jobs.push(moveKho(p,-i.sl,'ban','',don.ma+(khach?' · '+khach.ten:' · khách lẻ')));
    });
    if(khach){
      var tx=(khach.miTx||[]).slice();
      if(dungDiem>0)tx.unshift({ngay:S.dayId,viec:'Dùng điểm trừ vào đơn',tu:'Bán hàng',diem:-dungDiem});
      if(tichVe>0)tx.unshift({ngay:S.dayId,viec:'Mua hàng '+vnd(phaiTra)+', tích 10%',tu:'Bán hàng',diem:tichVe});
      var dsu=(khach.donSu||[]).slice();
      dsu.unshift({ngay:S.dayId,loai:'hang',tomTat:S.cart.map(function(i){return i.ten+' ×'+i.sl}).join(', '),tien:phaiTra});
      jobs.push(patch('members/'+khach.id,{diemMi:Math.max(0,(khach.diemMi||0)-dungDiem+tichVe),miTx:tx.slice(0,80),donSu:dsu.slice(0,80)}));

/* ========== KHO TEP: excel, word, pdf, anh ========== */
var CHUNK=150000;
var CHO_PHEP=['pdf','png','jpg','jpeg','webp','gif','xlsx','docx','pptx','csv','txt','md','json','svg','html','mp4','webm','epub','ttf'];
var TOI_DA=8*1024*1024;

function duoiTep(n){var i=String(n).lastIndexOf('.');return i<0?'':String(n).slice(i+1).toLowerCase()}
function laAnh(mime,ten){return /^image\//.test(mime||'')||['png','jpg','jpeg','webp','gif'].indexOf(duoiTep(ten))>=0}

function nenAnh(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('doc loi'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){res(fr.result)};
      img.onload=function(){
        var W=1600,w=img.width,h=img.height;
        if(w<=W&&h<=W&&fr.result.length<900000)return res(fr.result);
        var s=Math.min(1,W/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*s);cv.height=Math.round(h*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.78));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function docTep(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('doc loi'))};
    fr.onload=function(){res(fr.result)};
    fr.readAsDataURL(file);
  });
}
function tachChunk(s){var a=[];for(var i=0;i<s.length;i+=CHUNK)a.push(s.slice(i,i+CHUNK));return a}

function luuTep(file,thuoc,nhan,onTien){
  var duoi=duoiTep(file.name);
  if(CHO_PHEP.indexOf(duoi)<0)return Promise.reject(new Error('Đuôi .'+duoi+' chưa nhận. Nhận được: '+CHO_PHEP.join(', ')+'. File .doc và .xls cũ hãy lưu lại thành .docx hoặc .xlsx.'));
  if(file.size>TOI_DA)return Promise.reject(new Error('Tệp '+Math.round(file.size/1048576*10)/10+'MB, quá 8MB. Nén lại hoặc cắt bớt.'));
  var pre=laAnh(file.type,file.name)?nenAnh(file):docTep(file);
  return pre.then(function(dataUrl){
    var parts=tachChunk(dataUrl);
    if(parts.length>40)throw new Error('Tệp sau khi mã hoá quá lớn, hãy nén nhỏ lại.');
    var fid=uid('tep');
    var jobs=parts.map(function(c,i){return docRef('files/'+fid+'/data/'+i).set({b64:c})});
    var done=0;
    if(onTien)jobs=jobs.map(function(pr){return pr.then(function(){done++;onTien(Math.round(done/parts.length*100))})});
    return Promise.all(jobs).then(function(){
      return save('files/'+fid,{ten:file.name,mime:file.type||'',kich:file.size,
        chunks:parts.length,anh:laAnh(file.type,file.name),thuoc:thuoc||'',nhan:nhan||'',
        ai:(S.me&&S.me.ten)||'?',luc:new Date().toISOString()}).then(function(){return fid});
    });
  });
}
function docTepDay(fid){
  return docRef('files/'+fid).get().then(function(s){
    if(!s.exists)throw new Error('Không thấy tệp');
    var meta=s.data();
    var jobs=[];
    for(var i=0;i<meta.chunks;i++)jobs.push(docRef('files/'+fid+'/data/'+i).get());
    return Promise.all(jobs).then(function(ss){
      var b64='';ss.forEach(function(x){b64+=(x.data()||{}).b64||''});
      return {meta:meta,dataUrl:b64};
    });
  });
}
function urlToBlob(u){
  var i=u.indexOf(',');var head=u.slice(0,i),body=u.slice(i+1);
  var mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
  var bin=atob(body);var arr=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
  return new Blob([arr],{type:mime});
}
function xoaTep(fid,chunks){
  var jobs=[docRef('files/'+fid).delete()];
  for(var i=0;i<(chunks||0);i++)jobs.push(docRef('files/'+fid+'/data/'+i).delete());
  return Promise.all(jobs);
}
function moTep(fid){
  toast('Đang mở tệp...');
  docTepDay(fid).then(function(r){
    if(r.meta.anh){
      var b=E('div',{style:'text-align:center'});
      b.appendChild(E('img',{src:r.dataUrl,style:'max-width:100%;border-radius:8px;border:1px solid var(--line)'}));
      b.appendChild(E('div',{style:'font-size:12px;color:var(--ink-3);margin-top:10px'},
        esc(r.meta.ten)+' · '+Math.round(r.meta.kich/1024)+'KB · '+esc(r.meta.ai)+' tải lên '+dmy(r.meta.luc.slice(0,10))));
      modal(r.meta.ten,b,[S.dl?btn('Tải về máy',function(){taiVeTep(r)}):null,btn('Đóng',closeModal)].filter(Boolean));
    } else {
      if(!S.dl)return toast('Lượt xem này không tải file về được',true);
      taiVeTep(r);
    }
  }).catch(function(e){toast(e.message||'Không mở được tệp',true)});
}
function taiVeTep(r){
  S.dl.save({filename:r.meta.ten,data:urlToBlob(r.dataUrl)})
    .then(function(){toast('Đã gửi tệp cho bạn')})
    .catch(function(e){toast(e&&e.code==='declined'?'Bạn đã huỷ tải':'Không tải được tệp',true)});
}
function nutTaiLen(thuoc,nhan,xong){
  var wrap=E('div');
  var inp=E('input',{type:'file',style:'display:none',accept:'.pdf,.png,.jpg,.jpeg,.webp,.gif,.xlsx,.docx,.pptx,.csv,.txt,.md,.svg'});
  var bar=E('div',{style:'display:none;height:6px;border-radius:4px;background:var(--surface-2);margin-top:8px;overflow:hidden'});
  var fill=E('div',{style:'height:100%;width:0;background:var(--la);transition:width .2s'});bar.appendChild(fill);
  var b=btn('Chọn tệp từ máy',function(){inp.click()},'pri');

    var f=inp.files&&inp.files[0];if(!f)return;
    b.disabled=true;b.textContent='Đang tải lên...';bar.style.display='block';
    luuTep(f,thuoc,nhan,function(pc){fill.style.width=pc+'%'}).then(function(fid){
      b.disabled=false;b.textContent='Chọn tệp từ máy';bar.style.display='none';fill.style.width='0';
      inp.value='';toast('Đã tải lên '+f.name);
      if(xong)xong(fid,f);

      b.disabled=false;b.textContent='Chọn tệp từ máy';bar.style.display='none';
      inp.value='';toast(e.message||'Không tải lên được',true);

function veTepCua(thuoc,host){
  host.innerHTML='<div style="font-size:13px;color:var(--ink-3)">Đang đọc danh sách tệp...</div>';
  colRef('files').where('thuoc','==',thuoc).limit(60).get().then(function(q){
    host.innerHTML='';
    if(!q.docs.length){host.innerHTML='<div style="font-size:13.5px;color:var(--ink-3)">Chưa có tệp nào.</div>';return}
    var ds=q.docs.map(function(dd){var o=dd.data();o.id=dd.id;return o});
    ds.sort(function(a,b){return a.luc<b.luc?1:-1});
    ds.forEach(function(f){
      var r=E('div',{'class':'rl'});
      r.appendChild(E('span',{'class':'nm'},esc(f.ten)+'<br><span class="mut">'+Math.round(f.kich/1024)+'KB · '+esc(f.ai)+' · '+dmy(f.luc.slice(0,10))+'</span>'));
      r.appendChild(btn(f.anh?'Xem ảnh':'Tải về',function(){
        ghiNhatKy('Mở tệp '+f.ten,S.me.ten,'');moTep(f.id);
      },'sm'+(f.anh?' pri':'')));
      r.appendChild(btn('Gỡ',function(){
        confirmBox('Gỡ tệp','Gỡ '+f.ten+' khỏi hệ thống. Không lấy lại được.',function(){
          xoaTep(f.id,f.chunks).then(function(){
            ghiNhatKy('Gỡ tệp '+f.ten,S.me.ten,'');toast('Đã gỡ');veTepCua(thuoc,host);
          }).catch(dbErr);
        },'Gỡ hẳn');
      },'sm dg'));
      host.appendChild(r);
    });
  }).catch(function(e){host.innerHTML='<div style="font-size:13px;color:var(--do)">Chưa đọc được danh sách tệp.</div>';});
}

];

  {k:'khaoSat',t:'Khảo sát mặt bằng'},
  {k:'phongVan',t:'Phỏng vấn'},
  {k:'daoTao',t:'Đào tạo nghề, có thi'},
  {k:'hocQuyTrinh',t:'Học quy trình vận hành'},
  {k:'thuNghiem',t:'Thử nghiệm và chuyển giao'},
  {k:'kyHopDong',t:'Ký hợp đồng và khai trương'}
];
var TRANG_THAI_UV={
  khao_sat:{t:'Đang khảo sát',c:'n'}, phong_van:{t:'Đang phỏng vấn',c:'wn'},
  dao_tao:{t:'Đang đào tạo',c:'wn'}, thu_nghiem:{t:'Đang thử nghiệm',c:'wn'},
  da_ky:{t:'Đã ký, đang vận hành',c:'ok'}, tu_choi:{t:'Đã dừng',c:'bd'}
};
function uvById(id){for(var i=0;i<S.candidates.length;i++)if(S.candidates[i].id===id)return S.candidates[i];return null}
function uvXongBuoc(uv){var qt=uv.quyTrinh||{};var n=0;QUY_TRINH.forEach(function(q){if(qt[q.k]&&qt[q.k].xong)n++});return n}
function uvDuChanDung(uv){
  var cd=uv.chanDung||{},kp=uv.khongPhuHop||{};
  var okAll=CHAN_DUNG.every(function(c){return !!cd[c.k]});
  var noBad=KHONG_PHU_HOP.every(function(k){return !kp[k.k]});
  return okAll&&noBad;
}
function uvDuTieuChuan(uv){var tc=uv.tieuChuan||{};return TIEU_CHUAN.every(function(t){return !!tc[t.k]})}
function uvDaThiDat(uv){return !!(uv.quyTrinh&&uv.quyTrinh.daoTao&&uv.quyTrinh.daoTao.ketQua==='dat')}
function uvDuNhuongQuyen(uv){return uvDuChanDung(uv)&&uvDuTieuChuan(uv)&&uvDaThiDat(uv)}

function vNhuongQuyen(m){
  head(m,'Điểm quầy mẫu',null,[btn('+ Thêm ứng viên',function(){formUngVien(null)},'pri')]);
  m.appendChild(E('div',{style:'font-size:13.5px;color:var(--ink-3);margin:-12px 0 16px;max-width:78ch'},
    'Nơi theo dõi những người đang được quầy mẫu Vạn Phúc khảo sát, phỏng vấn và đào tạo để mở điểm mới. Mỗi ứng viên có một hồ sơ riêng, chấm được đã đủ tiêu chuẩn nhượng quyền hay chưa.'));

  var duNQ=S.candidates.filter(uvDuNhuongQuyen).length;
  var dangDT=S.candidates.filter(function(x){return x.trangThai==='dao_tao'}).length;
  var daKy=S.candidates.filter(function(x){return x.trangThai==='da_ky'}).length;
  var k=E('div',{'class':'kpis'});
  k.appendChild(kpi('Đang theo dõi',S.candidates.length,'ứng viên',function(){}));
  k.appendChild(kpi('Đủ tiêu chuẩn nhượng quyền',duNQ,'sẵn sàng ký',function(){},duNQ>0));
  k.appendChild(kpi('Đang đào tạo',dangDT,'chưa thi hoặc chưa đạt',function(){}));
  k.appendChild(kpi('Đã ký, đang vận hành',daKy,'điểm',function(){}));
  m.appendChild(k);

  var fils=[['all','Tất cả'],['khao_sat','Khảo sát'],['phong_van','Phỏng vấn'],['dao_tao','Đào tạo'],['thu_nghiem','Thử nghiệm'],['da_ky','Đã ký'],['tu_choi','Đã dừng']];
  var fb=E('div',{'class':'fil'});
  fils.forEach(function(f){fb.appendChild(E('button',{'class':(S.filter===f[0]||(S.filter==='all'&&f[0]==='all'))?'on':'',onclick:function(){S.filter=f[0];render()}},esc(f[1])))});

  else c.appendChild(tbl(['Ứng viên','Khu vực','Bước hiện tại','Trạng thái','Đủ tiêu chuẩn'],list.map(function(x){
    var buoc=uvXongBuoc(x);
    var dots=QUY_TRINH.map(function(q,i){return '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:'+(i<buoc?'var(--la)':'var(--line-2)')+'"></span>'}).join('');
    var tt=TRANG_THAI_UV[x.trangThai]||{t:x.trangThai,c:'n'};
    var du=uvDuNhuongQuyen(x);
    return {cells:[{h:'<b>'+esc(x.ten)+'</b>'+(x.sdt?'<br><span style="font-size:11.5px;color:var(--ink-3)" class="num">'+esc(x.sdt)+'</span>':'')},
      {h:esc(x.khuVuc||x.diaChi||'')},
      {h:dots+'<div style="font-size:11px;color:var(--ink-3);margin-top:4px">'+buoc+'/6 bước</div>'},
      {h:'<span class="ch '+tt.c+'">'+esc(tt.t)+'</span>'},
      {h:du?'<span class="ch ok">Đủ tiêu chuẩn</span>':'<span class="ch n">Chưa đủ</span>'}],
      __click:function(){go('ungvien',x.id)}};
  })));

      var v=Object.assign({},tc);v[t.k]=!v[t.k];patch('candidates/'+x.id,{tieuChuan:v}).catch(dbErr);
    }}));
    r.appendChild(E('div',null,'<div class="nm">'+esc(t.t)+'</div><div style="font-size:12.5px;color:var(--ink-3);margin-top:2px;max-width:60ch">'+esc(t.d)+'</div>'));
    cTC.appendChild(r);
  });

function vReports(m){
  head(m,'Báo cáo',null,[S.dl?btn('Xuất file Excel',function(){xuatCSVThang()},'pri'):null]);
  var thang=S.thang||S.dayId.slice(0,7);
  var f=E('div',{style:'display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap'});
  f.appendChild(E('input',{type:'month',value:thang,style:'padding:8px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)',
    onchange:function(e){S.thang=e.target.value;taiThang()}}));
  m.appendChild(f);
  var host=E('div');m.appendChild(host);
  host.innerHTML='<div class="empty">Đang đọc số liệu tháng...</div>';
  taiThang();

  function taiThang(){
    var th=S.thang||thang;
    colRef('days').orderBy('ngay').limit(400).get().then(function(q){
      var ds=q.docs.map(function(d){return d.data()}).filter(function(d){return d.ngay&&d.ngay.slice(0,7)===th});
      ve(ds,th);
    }).catch(function(e){host.innerHTML='';host.appendChild(E('div',{'class':'empty'},'<b>Chưa đọc được</b>Thử lại sau.'));dbErr(e)});
  }
  function ve(ds,th){
    host.innerHTML='';
    var dt=0,soDon=0,theBan=0,tienThe=0,luotTap=0;
    ds.forEach(function(d){
      (d.donHang||[]).forEach(function(o){dt+=o.phaiTra||0;soDon++;if(o.laThe){theBan++;tienThe+=o.phaiTra||0}});
      Object.keys(d.lop||{}).forEach(function(k){luotTap+=((d.lop[k].coMat)||[]).length});
    });
    var conHan=S.members.filter(function(x){var c=conNgay(x);return c!==null&&c>=0}).length;
    var moi=S.members.filter(function(x){return x.taoLuc&&x.taoLuc.slice(0,7)===th}).length;
    var k=E('div',{'class':'kpis'});
    k.appendChild(kpi('Doanh thu',vnd(dt).replace('đ',''),soDon+' đơn',function(){}));
    k.appendChild(kpi('Hội viên còn hạn',conHan,'trên '+S.members.length+' hồ sơ',function(){go('members')}));
    k.appendChild(kpi('Hội viên mới',moi,'trong tháng',function(){}));
    k.appendChild(kpi('Thẻ đã bán',theBan,vnd(tienThe),function(){go('cards')}));
    k.appendChild(kpi('Lượt đến lớp',luotTap,'cả tháng',function(){go('class')},true));
    host.appendChild(k);

    var c=E('div',{'class':'card'});c.appendChild(E('h3',null,'Doanh thu chia theo nguồn'));
    var sp=dt-tienThe;
    c.appendChild(tbl(['Nguồn',{t:'Số tiền',r:1},{t:'Tỷ trọng',r:1}],[
      ['Bán thẻ và gia hạn',{r:1,h:'<b class="num">'+vnd(tienThe)+'</b>'},{r:1,h:'<span class="ch ok">'+(dt?Math.round(tienThe/dt*100):0)+'%</span>'}],
      ['Sản phẩm và dịch vụ',{r:1,h:'<b class="num">'+vnd(sp)+'</b>'},{r:1,h:'<span class="ch ok">'+(dt?Math.round(sp/dt*100):0)+'%</span>'}]
    ]));
    host.appendChild(c);

    var c2=E('div',{'class':'card'});c2.appendChild(E('h3',null,'Doanh thu từng ngày'));
    var mx=1;var days=ds.map(function(d){var s=(d.donHang||[]).reduce(function(a,o){return a+(o.phaiTra||0)},0);if(s>mx)mx=s;return {d:d.ngay,s:s}});
    days.sort(function(a,b){return a.d<b.d?-1:1});
    if(!days.length)c2.appendChild(E('div',{style:'color:var(--ink-3)'},'Chưa có ngày nào có số liệu.'));
    else{
      var spk=E('div',{'class':'spark',style:'height:70px'});
      days.forEach(function(x,i){spk.appendChild(E('i',{'class':i===days.length-1?'hi':'',style:'height:'+Math.max(2,Math.round(x.s/mx*100))+'%',title:dmy(x.d)+': '+vnd(x.s)}))});
      c2.appendChild(spk);
      c2.appendChild(E('div',{style:'font-size:12px;color:var(--ink-3);margin-top:8px'},
        days.length+' ngày có hoạt động · cao nhất '+vnd(mx)));
    }
    host.appendChild(c2);
    S.baoCao={th:th,ds:ds,dt:dt,soDon:soDon,theBan:theBan,tienThe:tienThe,luotTap:luotTap,conHan:conHan,moi:moi};
  }
}
function csv(rows){
  return '﻿'+rows.map(function(r){return r.map(function(c){
    var s=String(c==null?'':c);
    return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(';')}).join('\r\n');
}
function taiFile(name,text){
  if(!S.dl)return toast('Chưa dùng được chức năng tải file trong lượt xem này',true);
  S.dl.save({filename:name,data:text}).then(function(){toast('Đã gửi file cho bạn')}).catch(function(){toast('Bạn đã huỷ tải file')});
}
function xuatCSVThang(){
  var b=S.baoCao;if(!b)return toast('Chưa có số liệu',true);
  var rows=[['Báo cáo tháng',b.th],[],
    ['Doanh thu',b.dt],['Số đơn',b.soDon],['Thẻ đã bán',b.theBan],['Tiền thẻ',b.tienThe],
    ['Lượt đến lớp',b.luotTap],['Hội viên còn hạn',b.conHan],['Hội viên mới',b.moi],[],
    ['Ngày','Giờ','Khách','Mặt hàng','Số lượng','Đơn giá','Phải trả','Hình thức','Người bán']];
  b.ds.forEach(function(d){(d.donHang||[]).forEach(function(o){
    o.items.forEach(function(i,idx){
      rows.push([d.ngay,o.g,o.khachTen||'Khách lẻ',i.ten,i.sl,i.gia,idx===0?o.phaiTra:'',idx===0?o.hinhThuc:'',idx===0?o.nguoiBan:'']);
    });
  })});
  taiFile('bao-cao-quay-'+b.th+'.csv',csv(rows));
}
function xuatCSVBan(){
  var don=(S.day.donHang||[]);
  if(!don.length)return toast('Hôm nay chưa có đơn nào',true);
  var rows=[['Phiếu xuất bán ngày',S.dayId],[],['Mã đơn','Giờ','Khách','Mặt hàng','Số lượng','Đơn giá','Thành tiền','Người bán']];
  don.forEach(function(o){o.items.forEach(function(i){
    rows.push([o.ma,o.g,o.khachTen||'Khách lẻ',i.ten,i.sl,i.gia,i.gia*i.sl,o.nguoiBan]);
  })});
  taiFile('phieu-xuat-'+S.dayId+'.csv',csv(rows));
}

/* ========== 11. NHAT KY ========== */

function formStaff(s){
  var isNew=!s;
  var b=E('div',{'class':'f'});
  b.innerHTML='<div class="row"><div><label>Họ tên</label><input id="st_t" value="'+esc(s?s.ten:'')+'"></div>'+
    '<div><label>Vai trò</label><select id="st_v">'+Object.keys(VAITRO).map(function(k){
      return '<option value="'+k+'"'+(s&&s.vaiTro===k?' selected':'')+'>'+VAITRO[k]+'</option>'}).join('')+'</select></div></div>'+
    '<div class="row"><div><label>Mã PIN 4 số</label><input id="st_p" class="pin" inputmode="numeric" maxlength="4" value="'+esc(s?s.pin:'')+'"></div>'+
    '<div><label>Trạng thái</label><select id="st_h"><option value="1"'+(!s||s.hoatDong!==false?' selected':'')+'>Đang làm</option><option value="0"'+(s&&s.hoatDong===false?' selected':'')+'>Đã nghỉ</option></select></div></div>';
  modal(isNew?'Thêm nhân sự':'Sửa nhân sự',b,[btn('Thôi',closeModal),btn('Lưu',function(){
    var t=$('#st_t').value.trim(),p=$('#st_p').value.trim();
    if(t.length<2)return toast('Nhập họ tên',true);
    if(!/^\d{4}$/.test(p))return toast('PIN phải đúng 4 chữ số',true);
    var id=s?s.id:uid('nv');
    save('staff/'+id,{ten:t,vaiTro:$('#st_v').value,pin:p,hoatDong:$('#st_h').value==='1',
      taoLuc:s?s.taoLuc:new Date().toISOString()}).then(function(){
      ghiNhatKy((isNew?'Thêm':'Sửa')+' nhân sự',S.me.ten,t);closeModal();toast('Đã lưu');
    }).catch(dbErr);
  },'pri')]);
}
