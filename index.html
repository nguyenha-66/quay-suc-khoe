<title>Quầy Sức Khỏe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#16326B; --navy-2:#0F2552; --sky:#3FAEE0; --yellow:#FFC81E; --pink:#E8368F; --orange:#F2811D; --green:#4FB947;
    --paper:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF1F7; --surface-3:#E1E7F0;
    --ink:#101B33; --ink-2:#3A4760; --ink-3:#6A7690;
    --line:#E0E5EE; --line-2:#C9D1DE;
    --la:#16326B; --la-2:#0F2552; --la-soft:#E6EDF8; --la-tint:#F4F7FC;
    --ok:#2C7D27; --ok-soft:#E5F4E3;
    --vang:#A85607; --vang-soft:#FFF1DA;
    --do:#C21E6B; --do-soft:#FCE6F0;
    --info:#17739F; --info-soft:#E2F3FB;
    --shell:#16326B; --shell-2:#0F2552; --shell-ink:#FFFFFF; --shell-dim:#A9B8D6; --shell-hi:rgba(255,255,255,.1);
    --sh:0 1px 2px rgba(16,27,51,.05);
    --sh2:0 12px 40px -12px rgba(16,27,51,.35);
    --r:12px; --rl:16px;
    --serif:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
    --sans:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0A1122; --surface:#111A2E; --surface-2:#18233B; --surface-3:#212D48;
    --ink:#E9EEF8; --ink-2:#B9C4D9; --ink-3:#8290AA;
    --line:#223051; --line-2:#33436A;
    --la:#5BBCE8; --la-2:#86CFEF; --la-soft:#15294A; --la-tint:#13213A;
    --ok:#7ED477; --ok-soft:#16301A;
    --vang:#FFB65C; --vang-soft:#35240C;
    --do:#FF76B2; --do-soft:#3A1628;
    --info:#6CC6EE; --info-soft:#12304A;
    --shell:#0D1D40; --shell-2:#081430; --shell-dim:#8C9DC0;
    --sh:0 1px 2px rgba(0,0,0,.4);
    --sh2:0 16px 48px -12px rgba(0,0,0,.8);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0A1122; --surface:#111A2E; --surface-2:#18233B; --surface-3:#212D48;
    --ink:#E9EEF8; --ink-2:#B9C4D9; --ink-3:#8290AA;
    --line:#223051; --line-2:#33436A;
    --la:#5BBCE8; --la-2:#86CFEF; --la-soft:#15294A; --la-tint:#13213A;
    --ok:#7ED477; --ok-soft:#16301A;
    --vang:#FFB65C; --vang-soft:#35240C;
    --do:#FF76B2; --do-soft:#3A1628;
    --info:#6CC6EE; --info-soft:#12304A;
    --shell:#0D1D40; --shell-2:#081430; --shell-dim:#8C9DC0;
    --sh:0 1px 2px rgba(0,0,0,.4);
    --sh2:0 16px 48px -12px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:0}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  button{font:inherit;color:inherit}
  input,select,textarea{font:inherit}
  .num,td,.kpi .v{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}
  ::selection{background:var(--sky);color:#fff}

  /* ===== khung ===== */
  #shell{display:flex;min-height:100vh}
  nav#side{flex:none;width:236px;background:var(--shell);color:var(--shell-ink);padding:22px 12px 22px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  #side .brand{padding:4px 10px 18px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.1)}
  #side .brand img{display:block;width:150px;height:auto}
  #side .brand small{display:block;font-size:11.5px;font-weight:600;color:var(--shell-dim);margin-top:12px;letter-spacing:.02em}
  #side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;font-size:13.5px;font-weight:500;color:var(--shell-dim);padding:9px 12px;border-radius:8px;cursor:pointer;position:relative;transition:color .12s,background .12s}
  #side button .ic{flex:none;width:18px;height:18px}
  #side button .ic svg{width:100%;height:100%;display:block}
  #side button:hover{color:#fff;background:rgba(255,255,255,.06)}
  #side button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  #side button.on .ic{color:var(--yellow)}
  #side .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--shell-dim);opacity:.7;padding:18px 12px 6px;font-weight:600}
  #side .who{margin:auto 0 0;padding:14px 12px 0;border-top:1px solid rgba(255,255,255,.1)}
  #side .who b{display:block;font-size:13.5px;color:#fff;font-weight:600}
  #side .who span{font-size:12px;color:var(--shell-dim)}
  #side .who button{padding:8px 0 0;font-size:12px;color:var(--sky);border:0;background:none;width:auto}
  #side .who button:hover{background:none;color:#fff}

  main{flex:1 1 auto;min-width:0;padding:28px 36px 80px;max-width:1320px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
  .top h2{font-size:24px;font-weight:700;flex:1 1 auto;color:var(--ink)}

  /* ===== nut ===== */
  .b{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 16px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s}
  .b:hover{background:var(--surface-2)}
  .b.pri{background:var(--navy);border-color:var(--navy);color:#fff}
  .b.pri:hover{background:var(--navy-2);border-color:var(--navy-2)}
  .b.warn{background:var(--vang-soft);border-color:transparent;color:var(--vang)}
  .b.dg{background:transparent;border-color:var(--line-2);color:var(--do)}
  .b.dg:hover{background:var(--do-soft);border-color:var(--do)}
  .b.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
  .b:disabled{opacity:.45;cursor:not-allowed}
  .b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  :root[data-theme="dark"] .b.pri{background:var(--sky);border-color:var(--sky);color:#08142C}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.pri{background:var(--sky);border-color:var(--sky);color:#08142C}}

  /* ===== the ===== */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
  .card>h3{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:14px;letter-spacing:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .grid2>.card{margin-bottom:0}
  .grid2{margin-bottom:18px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:18px}
  .grid3>.card{margin-bottom:0}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
  .kpi:hover{border-color:var(--line-2);box-shadow:var(--sh2)}
  .kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:500}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.25;margin-top:6px;color:var(--ink)}
  .kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
  .kpi.hl{border-color:var(--orange);background:var(--vang-soft)}
  .kpi.hl .v{color:var(--vang)}

  /* ===== bang ===== */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  th:first-child{border-radius:8px 0 0 8px}
  th:last-child{border-radius:0 8px 8px 0}
  td{padding:12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--la-tint)}
  td.r,th.r{text-align:right}
  td b{color:var(--ink);font-weight:600}

  /* ===== nhan ===== */
  .ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .ch::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .ch.ok{background:var(--ok-soft);color:var(--ok)}
  .ch.wn{background:var(--vang-soft);color:var(--vang)}
  .ch.bd{background:var(--do-soft);color:var(--do)}
  .ch.n{background:var(--surface-2);color:var(--ink-3)}
  .fam{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--info-soft);color:var(--info);white-space:nowrap;cursor:pointer}

  /* ===== form ===== */
  .f{display:grid;gap:14px}
  .f label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s}
  .f input:focus,.f select:focus,.f textarea:focus,.srch:focus,.dongthe input:focus,.dongthe select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(63,174,224,.2)}
  .f textarea{min-height:76px;resize:vertical}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .srch{flex:1 1 240px;min-width:0;padding:10px 14px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
  .fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .fil button{font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .fil button:hover{border-color:var(--ink-3)}
  .fil button.on{background:var(--navy);border-color:var(--navy);color:#fff}

  /* ===== dong ===== */
  .rl{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
  .rl:last-child{border-bottom:0}
  .rl .nm{flex:1 1 auto;color:var(--ink);font-weight:500;min-width:0}
  .rl .mut{color:var(--ink-3);font-weight:400;font-size:12.5px}
  .tick{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;background:var(--surface);cursor:pointer;position:relative;padding:0;transition:background .1s,border-color .1s}
  .tick.on{background:var(--green);border-color:var(--green)}
  .tick.on::after{content:"\2713";color:#fff;font-size:14px;font-weight:700;position:absolute;inset:0;display:grid;place-items:center}

  /* ===== modal ===== */
  #ov{position:fixed;inset:0;background:rgba(10,20,45,.55);display:grid;place-items:center;padding:16px;z-index:80}
  #ov .mo{background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh2);width:min(680px,100%);max-height:90vh;overflow:auto}
  #ov .mh{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
  #ov .mh h3{font-size:17px;font-weight:700;flex:1 1 auto}
  #ov .mb{padding:22px 24px}
  #ov .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
  #ov .card{background:var(--surface-2);border-color:transparent}
  .x{background:none;border:0;font-size:24px;line-height:1;color:var(--ink-3);cursor:pointer;padding:0 4px;border-radius:6px}
  .x:hover{color:var(--ink)}

  /* ===== toast ===== */
  #tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  #tt div{background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--sh2);max-width:86vw;border:0}
  #tt div.bad{background:var(--do);color:#fff;border:0}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:13.5px}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}
  .warn{background:var(--vang-soft);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)}
  .warn b{color:var(--ink)}
  .warn.bad{background:var(--do-soft)}
  .warn.good{background:var(--ok-soft)}
  .spark{display:flex;align-items:flex-end;gap:6px;height:64px}
  .spark i{flex:1;background:var(--la-soft);border-radius:4px 4px 0 0;min-height:3px}
  .spark i.hi{background:var(--sky)}

  /* ===== dang nhap ===== */
  #gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
  #gate .bx{width:min(420px,100%);background:var(--surface);border-radius:var(--rl);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);padding:30px 30px 32px}
  #gate .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:24px;padding:4px;background:var(--surface-2);border-radius:10px}
  #gate .seg button{font-size:13px;font-weight:600;padding:8px 12px;border-radius:7px;border:0;background:transparent;color:var(--ink-3);cursor:pointer}
  #gate .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
  #gate .gbrand{text-align:center;margin-bottom:22px}
  #gate .gbrand img{display:block;width:200px;height:auto;margin:0 auto}
  #gate .gbrand span{font-size:13px;color:var(--ink-3);display:block;margin-top:10px;font-weight:500}
  #gate .who{display:grid;gap:8px;margin-bottom:6px}
  #gate .who button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
  #gate .who button:hover{border-color:var(--sky);background:var(--la-tint)}
  #gate .who b{display:block;font-size:14.5px;font-weight:600}
  #gate .who span{font-size:12.5px;color:var(--ink-3)}
  #gate .b.pri{width:100%;padding:12px 16px;font-size:14.5px}
  #gate .foot{text-align:center;font-size:13px;color:var(--ink-3);margin-top:16px}
  .glabel{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:10px}
  .pin{letter-spacing:.6em;text-align:center;font-size:22px!important;font-weight:700}
  .avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--sky)}

  /* ===== the hoi vien ===== */
  .mcard{border-radius:16px;padding:24px 26px;color:#fff;background:var(--navy);margin-bottom:18px;position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .mcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--pink) 0 20%,var(--sky) 20% 40%,var(--yellow) 40% 60%,var(--orange) 60% 80%,var(--green) 80%)}
  .mcard .t{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
  .mcard .n{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
  .mcard .s{font-size:13px;color:#C9D4EC}
  .mcard img{width:120px;height:auto;margin-left:auto}

  /* ===== chuyen khoan QR ===== */
  .qrbox{background:#fff;padding:12px;border-radius:12px;display:inline-block;border:1px solid var(--line)}
  .qrbox img,.qrbox canvas{display:block;width:220px;height:220px}
  .ckwrap{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
  .ckinfo{flex:1 1 220px;min-width:0}
  .ckinfo .rl .nm{font-weight:400;color:var(--ink-3)}
  .ckma{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .dongthe{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface)}
  .dongthe select,.dongthe input{width:100%;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink)}
  .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 8px}

  /* ===== cua hoi vien ===== */
  .ctop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ctop h3{flex:1 1 auto;font-size:14.5px;font-weight:700;margin:0}
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .mi-o{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .mi-o span{font-size:12.5px;color:var(--ink-3)}
  .mi-o b{font-size:20px;font-weight:700;color:var(--ink)}
  .mi-o small{font-size:12px;font-weight:500;color:var(--ink-3)}
  .mi-o i{font-style:normal;align-self:flex-start}
  .spk-lb{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3);margin-top:8px}
  .ql{list-style:none;margin:0;padding:0;display:grid;gap:9px}
  .ql li{position:relative;padding-left:24px;font-size:13.5px;color:var(--ink-2)}
  .ql li::before{content:"";position:absolute;left:4px;top:.4em;width:10px;height:5px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}
  .ngay-o{flex:none;width:52px;text-align:center;border-radius:10px;background:var(--la-soft);padding:6px 0}
  .ngay-o b{display:block;font-size:20px;line-height:1.15;color:var(--la)}
  .ngay-o span{font-size:11.5px;color:var(--ink-3);font-weight:600}
  .ftype{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;letter-spacing:.03em}
  .rl.tep{flex-wrap:wrap}
  .rl.tep .nm{min-width:0;flex:1 1 220px}
  .tep-ten{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
  .tep-act{display:flex;gap:6px;flex:none;margin-left:auto}
  .drop{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:28px 16px;border:2px dashed var(--line-2);border-radius:12px;background:var(--la-tint);color:var(--ink-2);cursor:pointer;font:inherit;transition:border-color .12s,background .12s}
  .drop b{font-size:14.5px;color:var(--la);font-weight:600}
  .drop span{font-size:12.5px;color:var(--ink-3)}
  .drop:hover,.drop.on{border-color:var(--sky);background:var(--la-soft)}
  .drop:disabled{cursor:progress}

  /* ===== tu van, ho so ===== */
  .mut{color:var(--ink-3);font-size:12.5px}
  .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--pink);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
  .tabs button{background:none;border:0;padding:10px 14px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--la);border-bottom-color:var(--la);font-weight:600}
  .tabs .badge{margin-left:2px}
  .phd{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;flex-wrap:wrap}
  .avatar.lg{width:60px;height:60px;font-size:22px;background:var(--navy)}
  .phd-t{flex:1 1 240px;min-width:0}
  .phd-t h2{font-size:21px;font-weight:700}

    'resource-exhausted':'Hệ thống đang bận, thử lại sau một chút.',
    'permission-denied':'Không có quyền truy cập dữ liệu này. Kiểm tra lại Firestore Rules.',
    'unauthenticated':'Phiên đăng nhập đã hết, hãy tải lại trang.',
    'unavailable':'Mất kết nối tới kho dữ liệu, thử lại.',
    'not-found':'Không tìm thấy dữ liệu.'};
  toast(m[c]||'Không lưu được, thử lại.',true);
  return null;
}

/* ========== hoi vien ========== */
function mById(id){for(var i=0;i<S.members.length;i++)if(S.members[i].id===id)return S.members[i];return null}
function pById(id){for(var i=0;i<S.products.length;i++)if(S.products[i].id===id)return S.products[i];return null}
function conNgay(m){if(!m||!m.theHetHan)return null;return daysBetween(ymd(),m.theHetHan)}
function tinhTrangThe(m){
  var c=conNgay(m);
  if(c===null)return {t:'Chưa có thẻ',c:'n'};
  if(c<0)return {t:'Hết hạn '+dm(m.theHetHan),c:'bd'};
  if(c<=14)return {t:'Còn '+c+' ngày',c:'wn'};
  return {t:'Còn '+c+' ngày',c:'ok'};
}
function buoiTap30(m){
  var n=0,moc=addMonths(ymd(),-1);
  (m.tapLuc||[]).forEach(function(d){if(d>=moc)n++});
  return n;
}
function tienToDiem(){
  var c=S.cfg||{};
  if(c.maDiem)return String(c.maDiem).toUpperCase();
  var t=kd(c.tenDiem||'').replace(/^diem\s+/,'').trim();
  var ch=t.split(/\s+/).filter(Boolean).map(function(w){return w.charAt(0)}).join('').toUpperCase();
  return 'Q'+(ch||'X');
}
function soMa(ma,tt){if(!ma||String(ma).indexOf(tt)!==0)return 0;var n=parseInt(String(ma).slice(tt.length),10);return isFinite(n)?n:0}
function maHVMoi(boQua,cong){
  var tt=tienToDiem(),mx=0;
  S.members.forEach(function(m){if(m.id!==boQua){var n=soMa(m.maHV,tt);if(n>mx)mx=n}});
  var so=mx+1+(cong||0);
  return tt+('0000'+so).slice(-Math.max(4,String(so).length));
}
function kiemTraMa(id,lan){
  lan=lan||0;if(lan>5)return;
  setTimeout(function(){
    var x=mById(id);if(!x||!x.maHV)return;
    var trung=S.members.filter(function(m){return m.id!==id&&m.maHV===x.maHV});
    if(!trung.length)return;
    var coTruoc=trung.some(function(m){return String(m.taoLuc||'')<String(x.taoLuc||'')||(String(m.taoLuc||'')===String(x.taoLuc||'')&&m.id<x.id)});
    if(coTruoc)patch('members/'+id,{maHV:maHVMoi(id)}).then(function(){kiemTraMa(id,lan+1)}).catch(function(){});
  },1200+Math.floor(Math.random()*800));
}
function lanDoCuoi(m){var a=m.doLan||[];return a.length?a[0]:null}

/* ========== khoi dong ========== */
function downloadsShim(){
  return {
    save:function(opts){
      return new Promise(function(resolve,reject){
        try{
          var data=opts&&opts.data;
          var blob=(typeof Blob!=='undefined'&&data instanceof Blob)?data:new Blob([data],{type:'text/plain;charset=utf-8'});
          var url=URL.createObjectURL(blob);
          var a=document.createElement('a');
          a.href=url;a.download=(opts&&opts.filename)||'tep-tai-ve';
          document.body.appendChild(a);a.click();document.body.removeChild(a);
          setTimeout(function(){URL.revokeObjectURL(url)},1500);
          resolve();
        }catch(e){reject(e)}
      });
    }
  };
}
function boot(){
  render();
  if(typeof firebase==='undefined'){offline('Chưa tải được thư viện Firebase. Kiểm tra kết nối mạng rồi tải lại trang.');return}
  if(!firebaseConfig||firebaseConfig.apiKey==='ĐIỀN_API_KEY'){
    offline('Chưa điền cấu hình Firebase. Mở file index.html, tìm biến "firebaseConfig" ở gần đầu file và điền thông tin lấy từ Firebase Console (Project settings → Your apps).');
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
  }catch(e){offline('Không khởi tạo được Firebase: '+(e&&e.message||''));return}
  firebase.auth().signInAnonymously().then(function(){
    S.db=firebase.firestore();
    try{S.db.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
    S.dl=downloadsShim();
    subscribe();
  }).catch(function(e){
    offline('Không đăng nhập được vào kho dữ liệu: '+(e&&e.message||'')+'. Kiểm tra đã bật "Anonymous" trong Firebase Authentication → Sign-in method chưa.');
  });
}

function subscribe(){
  S.subs.forEach(function(u){try{u()}catch(e){}});S.subs=[];
  var got={cfg:false,staff:false,mem:false,pro:false,cand:false,evt:false,fb:false,pay:false,tv:false,day:false};
  function tick(k){got[k]=true;if(got.cfg&&got.staff&&got.mem&&got.pro&&got.cand&&got.evt&&got.fb&&got.pay&&got.tv&&got.day){$('#boot').hidden=true;render()}}

  S.subs.push(colRef('payments').onSnapshot(function(q){
    S.payments=q.docs.map(function(d){var o=Object.assign({},d.data());o.ma=d.id;return o});
    S.payments.sort(function(a,b){return a.taoLuc<b.taoLuc?1:-1});
    tick('pay');
    if(S.phieuMo){
      var p=null;S.payments.forEach(function(z){if(z.ma===S.phieuMo.ma)p=z});
      if(p&&p.trangThai!==S.phieuMo.tt){
        if(p.trangThai==='xong')toast('Quầy đã nhận tiền, thẻ đã được gia hạn');
        moPhieuCK(p);
      }
    }
    render();
  },dbErr));

  S.subs.push(docRef('meta/config').onSnapshot(function(s){
    S.cfg=s.exists?s.data():null;tick('cfg');render();
  },dbErr));

  S.subs.push(colRef('staff').onSnapshot(function(q){
    S.staff=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('staff');render();
  },dbErr));

  S.subs.push(colRef('members').onSnapshot(function(q){
    S.members=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    S.members.sort(function(a,b){return kd(a.ten).localeCompare(kd(b.ten))});
    tick('mem');render();
  },dbErr));

  S.subs.push(colRef('products').onSnapshot(function(q){
    S.products=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('pro');render();
  },dbErr));

  S.subs.push(colRef('candidates').onSnapshot(function(q){
    S.candidates=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    tick('cand');render();
  },dbErr));

  S.subs.push(colRef('events').onSnapshot(function(q){
    S.events=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    S.events.sort(function(a,b){return a.ngay<b.ngay?-1:1});
    tick('evt');render();
  },dbErr));

  S.subs.push(colRef('feedback').onSnapshot(function(q){
    S.feedback=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    S.feedback.sort(function(a,b){return a.luc<b.luc?1:-1});
    tick('fb');render();
  },dbErr));

  S.subs.push(colRef('tuvan').onSnapshot(function(q){
    var cu=S.tvMap,moi={};
    S.tuvan=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;moi[o.id]=o.trangThai;return o});
    if(cu){
      S.tuvan.forEach(function(t){
        if(S.me&&t.trangThai==='cho'&&cu[t.id]!=='cho')toast('Bệnh án mới cần tư vấn: '+t.memberTen);
        if(!S.me&&S.customer&&t.memberId===S.customer.memberId&&t.trangThai==='xong'&&cu[t.id]!=='xong')toast('Bạn có lời khuyên mới từ chuyên gia');
      });
    }
    S.tvMap=moi;tick('tv');render();
  },dbErr));

  subDay();
}

/* ========== MAT KHAU: bam don gian bang SubtleCrypto ========== */
function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function sha256hex(s){
  var enc=new TextEncoder().encode(s);
  return crypto.subtle.digest('SHA-256',enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
  });
}
function hashPw(pw,salt){return sha256hex(salt+':'+pw)}

function veKhachGate(){

  wrap.appendChild(E('div',{'class':'glabel'},sub==='dangky'?'Tạo tài khoản hội viên':'Đăng nhập hội viên'));

      '<div><label>Nhập lại mật khẩu</label><input id="k_p2" type="password" class="pin" inputmode="numeric" maxlength="4"></div>';
    wrap.appendChild(f);

    btnDk.onclick=function(){
      var ten=$('#k_t').value.trim(),sdt=$('#k_s').value.trim(),pw=$('#k_p').value,pw2=$('#k_p2').value;
      if(ten.length<2)return toast('Nhập họ tên',true);
      if(!/^0\d{8,10}$/.test(sdt))return toast('Số điện thoại chưa đúng',true);
      if(!/^\d{4}$/.test(pw))return toast('Mật khẩu gồm đúng 4 chữ số',true);
      if(pw!==pw2)return toast('Hai mật khẩu chưa khớp',true);
      btnDk.disabled=true;btnDk.textContent='Đang tạo...';
      docRef('customers/'+sdt).get().then(function(s){

        var salt=randHex(8);
        hashPw(pw,salt).then(function(hash){
          var existing=null;S.members.forEach(function(mm){if(mm.sdt===sdt)existing=mm});
          var memberId=existing?existing.id:uid('hv');
          var jobs=[];
          if(existing&&!existing.maHV)jobs.push(patch('members/'+memberId,{maHV:maHVMoi(memberId)}));
          if(!existing)jobs.push(save('members/'+memberId,{maHV:maHVMoi(),ten:ten,sdt:sdt,namSinh:'',theLoai:'',nhaTen:'',quanHe:'',diemMi:0,doLan:[],tapLuc:[],miTx:[],ghiChu:[],taoLuc:new Date().toISOString()}));
          jobs.push(save('customers/'+sdt,{ten:ten,sdt:sdt,salt:salt,hash:hash,memberId:memberId,taoLuc:new Date().toISOString()}));
          Promise.all(jobs).then(function(){
            try{localStorage.setItem('qsk.khach',sdt)}catch(e){}
            S.customer={id:sdt,ten:ten,sdt:sdt,memberId:memberId};
            kiemTraMa(memberId);toast('Đã tạo tài khoản, chào '+ten);render();
          }).catch(function(e){btnDk.disabled=false;btnDk.textContent='Đăng ký';dbErr(e)});
        });
      }).catch(function(e){btnDk.disabled=false;btnDk.textContent='Đăng ký';dbErr(e)});
    };
    wrap.appendChild(btnDk);
    var fdk=E('div',{'class':'foot'});
    fdk.innerHTML='Đã có tài khoản? ';
    fdk.appendChild(E('span',{style:'color:var(--la);text-decoration:underline;cursor:pointer',onclick:function(){S.khachSub='dangnhap';render()}},'Đăng nhập'));

/* ========== 3. HO SO MOT HOI VIEN ========== */
function vungCua(c,v){
  if(c.lo==null||v==null)return {t:'Đã ghi',c:'n'};
  if(v<c.lo)return {t:'Dưới ngưỡng',c:'bd'};
  if(v>c.hi)return {t:'Trên ngưỡng',c:'wn'};
  return {t:'Trong ngưỡng',c:'ok'};
}
function timeline(x){
  var out=[];
  (x.doLan||[]).forEach(function(d){out.push({s:d.ngay,d:dmy(d.ngay),t:'Đo '+((BODO[d.bo]||{}).ten||''),ai:d.nguoiDo})});
  (x.tapLuc||[]).slice(-15).forEach(function(d){out.push({s:d,d:dmy(d),t:'Đi tập'})});
  (x.miTx||[]).forEach(function(r){if(r.tu==='Bán hàng')out.push({s:r.ngay,d:dmy(r.ngay),t:r.viec})});
  (x.ghiChu||[]).forEach(function(g){out.push({s:g.g.slice(0,10),d:dmy(g.g.slice(0,10)),t:g.t,ai:g.ai})});
  out.sort(function(a,b){return a.s<b.s?1:a.s>b.s?-1:0});
  return out;
}
function formGhiChu(x){
  var b=E('div',{'class':'f'},'<div><label>Khách vừa kể gì</label><textarea id="g_t" autofocus></textarea></div>');
  modal('Ghi chú · '+x.ten,b,[btn('Thôi',closeModal),btn('Lưu ghi chú',function(){
    var t=$('#g_t').value.trim();if(!t)return toast('Chưa nhập gì',true);
    var gc=[{g:new Date().toISOString(),ai:S.me.ten,t:t}].concat(x.ghiChu||[]).slice(0,60);
    patch('members/'+x.id,{ghiChu:gc}).then(function(){closeModal();toast('Đã lưu ghi chú')}).catch(dbErr);
  },'pri')]);
}
function lichSuDo(x){
  var b=E('div');
  b.appendChild(tbl(['Ngày','Bộ đo','Người đo','Chỉ số chính'],(x.doLan||[]).map(function(d){
    var bo=BODO[d.bo]||BODO.vienman;
    var chinh=bo.ct.slice(0,3).filter(function(c){return d.cs[c.k]!=null}).map(function(c){return c.t+' '+num(d.cs[c.k],c.d)+c.u}).join(' · ');
    return [dmy(d.ngay),esc(bo.ten),esc(d.nguoiDo||''),esc(chinh)];
  })));
  modal('Lịch sử đo · '+x.ten,b,[btn('Đóng',closeModal)]);
}

    var tr=E('tr');
    tr.appendChild(E('td',null,'<b>'+esc(c.t)+'</b>'+(c.u?' <span style="color:var(--ink-3);font-size:11.5px">'+esc(c.u)+'</span>':'')));
    var td=E('td');
    var inp=E('input',{type:'number',step:'any',inputmode:'decimal','data-k':c.k,style:'width:110px;padding:7px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)',
      oninput:function(){tinhChenh(c,inp,tr)}});
    td.appendChild(inp);tr.appendChild(td);
    tr.appendChild(E('td',{'class':'num'},truoc&&truoc.cs[c.k]!=null?num(truoc.cs[c.k],c.d):''));
    tr.appendChild(E('td',{'class':'num','data-ch':c.k},''));
    tb.appendChild(tr);
  });
  t.appendChild(tb);tw.appendChild(t);card.appendChild(tw);
  m.appendChild(card);

  function tinhChenh(c,inp,tr){
    var cell=tr.querySelector('[data-ch]');
    var v=parseFloat(inp.value);
    var p=truoc&&truoc.cs?truoc.cs[c.k]:null;
    if(!isFinite(v)||p==null){cell.innerHTML='';return}
    var d=v-p;
    cell.innerHTML='<span style="color:'+(d<0?'var(--la)':d>0?'var(--vang)':'var(--ink-3)')+'">'+(d>0?'+':'')+num(d,c.d)+'</span>';
  }

  var goiY=E('div',{'class':'card'});
  goiY.appendChild(E('h3',null,'Ghi chú buổi đo'));
  goiY.appendChild(E('textarea',{id:'do_gc',placeholder:'Điều cần nói với khách, hoặc điều khách vừa kể',
    style:'width:100%;min-height:64px;padding:9px 11px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)'}));
  m.appendChild(goiY);

  var act=E('div',{style:'display:flex;gap:8px;flex-wrap:wrap'});
  act.appendChild(btn('Huỷ',function(){go('member',x.id)}));
  act.appendChild(btn('Lưu và in tờ kết quả',function(){luuDo(true)},'pri'));
  act.appendChild(btn('Lưu, không in',function(){luuDo(false)}));
  m.appendChild(act);

  function luuDo(inRa){
    var cs={},co=0;
    card.querySelectorAll('input[data-k]').forEach(function(i){
      var v=parseFloat(i.value);
      if(isFinite(v)){cs[i.getAttribute('data-k')]=v;co++}
    });
    if(!co)return toast('Chưa nhập chỉ số nào',true);
    var ban={ngay:S.dayId,bo:boK,cs:cs,nguoiDo:S.me.ten};
    var doLan=[ban].concat(x.doLan||[]).slice(0,80);
    var gc=x.ghiChu||[];
    var note=$('#do_gc').value.trim();
    if(note)gc=[{g:new Date().toISOString(),ai:S.me.ten,t:note}].concat(gc).slice(0,60);
    patch('members/'+x.id,{doLan:doLan,ghiChu:gc}).then(function(){
      ghiNhatKy('Đo '+bo.ten+', '+co+' chỉ số',S.me.ten,x.ten);
      toast('Đã lưu buổi đo');
      if(inRa)inToKetQua(x,ban,truoc);
      go('member',x.id);
    }).catch(dbErr);
  }
}
function inToKetQua(x,lan,truoc){
  var bo=BODO[lan.bo]||BODO.vienman;
  var rows=bo.ct.filter(function(c){return lan.cs[c.k]!=null}).map(function(c){
    var v=lan.cs[c.k],p=truoc&&truoc.cs?truoc.cs[c.k]:null;
    var ch=(p!=null)?(v-p):null;
    var vg=vungCua(c,v);
    return '<tr><td>'+esc(c.t)+'</td><td>'+num(v,c.d)+' '+esc(c.u)+'</td><td>'+(p!=null?num(p,c.d):'')+'</td><td>'+(ch===null?'':(ch>0?'+':'')+num(ch,c.d))+'</td><td>'+esc(vg.t)+'</td></tr>';
  }).join('');

    (x.namSinh?' · sinh '+esc(x.namSinh):'')+' · ngày '+dmy(lan.ngay)+'</div>'+

    '<div class="ft">Chuyên viên đo: '+esc(lan.nguoiDo||'')+'. '+
    'Quầy Sức Khỏe là nơi đo chỉ số, hướng dẫn vận động và tư vấn chăm sóc sức khỏe. '+
    'Quầy không phải cơ sở khám chữa bệnh và không thay thế chỉ định của bác sĩ.<br>'+
    esc((S.cfg&&S.cfg.diaChi)||'')+'</div>';
  setTimeout(function(){window.print()},60);
}

function vangMayBuoi(x){
  var a=x.tapLuc||[];if(!a.length)return 99;

/* ========== 6. BAN HANG ========== */
function vSell(m){
  var khach=S.sellFor?mById(S.sellFor):null;
  head(m,'Bán hàng tại quầy',null,[
    btn(khach?'Đổi khách':'Chọn khách',function(){chonKhach(function(id){S.sellFor=id;render()})}),
    S.cart.length?btn('Xoá giỏ',function(){S.cart=[];render()},'dg'):null
  ]);
  m.appendChild(E('div',{style:'font-size:13.5px;color:var(--ink-3);margin:-12px 0 16px'},
    khach?('Đơn cho <b style="color:var(--ink)">'+esc(khach.ten)+'</b> · '+esc(khach.theLoai?GIA[khach.theLoai].ten:'chưa có thẻ')+' · đang có <span class="num">'+num(khach.diemMi||0)+'</span> điểm Mi'):'Khách lẻ'));

  var g=E('div',{'class':'grid2'});
  var c1=E('div',{'class':'card'});c1.appendChild(E('h3',null,'Chọn hàng'));
  var s=E('input',{'class':'srch',placeholder:'Tìm sản phẩm',style:'margin-bottom:10px',oninput:function(e){
    var q=kd(e.target.value);
    c1.querySelectorAll('[data-pn]').forEach(function(el){el.hidden=q&&kd(el.getAttribute('data-pn')).indexOf(q)<0});
  }});
  c1.appendChild(s);
  S.products.forEach(function(p){
    var het=(p.tonKho||0)<=0;
    var thieu=hoSoThieu(p).length>0;
    var r=E('div',{'class':'rl','data-pn':p.ten,style:het?'opacity:.45':''});
    r.appendChild(E('span',{'class':'nm'},esc(p.ten)+'<br><span class="mut">'+vnd(p.giaBan)+' · tồn '+(p.tonKho||0)+(thieu?' · <span style="color:var(--do)">thiếu giấy tờ</span>':'')+'</span>'));
    r.appendChild(E('button',{'class':'b sm'+(het?'':' pri'),disabled:het?'':null,onclick:function(){
      if(het)return;
      if(thieu)toast('Mặt hàng này đang thiếu giấy tờ, kiểm tra ở mục Sản phẩm',true);
      themGio(p);
    }},het?'Hết hàng':'Thêm'));
    c1.appendChild(r);
  });
  if(!S.products.length)c1.appendChild(E('div',{'class':'empty'},'<b>Chưa có sản phẩm</b>Vào mục Sản phẩm để thêm.'));
  g.appendChild(c1);

  var tam=S.cart.reduce(function(a,i){return a+i.gia*i.sl},0);
  var maxDiem=khach?Math.min(khach.diemMi||0,tam):0;
  var dungDiem=Math.min(S.dungDiem||0,maxDiem);
  var phaiTra=Math.max(0,tam-dungDiem);
  var tichVe=Math.round(phaiTra*TICH_MI);

  var c2=E('div',{'class':'card'});c2.appendChild(E('h3',null,'Giỏ hàng và thanh toán'));
  if(!S.cart.length)c2.appendChild(E('div',{style:'color:var(--ink-3);font-size:14px;padding:8px 0'},'Giỏ đang trống.'));
  S.cart.forEach(function(i,idx){
    var r=E('div',{'class':'rl'});
    r.appendChild(E('span',{'class':'nm'},esc(i.ten)+'<br><span class="mut">'+vnd(i.gia)+' mỗi cái</span>'));
    var qty=E('div',{style:'display:flex;align-items:center;gap:6px'});
    qty.appendChild(E('button',{'class':'b sm',onclick:function(){i.sl--;if(i.sl<=0)S.cart.splice(idx,1);render()}},'−'));
    qty.appendChild(E('span',{'class':'num',style:'min-width:22px;text-align:center;font-weight:700'},String(i.sl)));
    qty.appendChild(E('button',{'class':'b sm',onclick:function(){var p=pById(i.id);if(p&&i.sl>=(p.tonKho||0))return toast('Không đủ tồn kho',true);i.sl++;render()}},'+'));
    r.appendChild(qty);
    r.appendChild(E('span',{'class':'num',style:'min-width:88px;text-align:right;font-weight:700'},vnd(i.gia*i.sl)));
    c2.appendChild(r);
  });
  if(S.cart.length){
    var sum=E('div',{style:'margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)'});
    sum.appendChild(dong('Tạm tính',vnd(tam)));
    if(khach&&maxDiem>0){
      var rd=E('div',{'class':'rl'});
      rd.appendChild(E('span',{'class':'nm',style:'font-weight:400'},'Dùng điểm Mi <span class="mut">tối đa '+num(maxDiem)+'</span>'));
      var inp=E('input',{type:'number',min:'0',max:String(maxDiem),step:'1000',value:String(dungDiem),
        style:'width:120px;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink)',
        oninput:function(e){S.dungDiem=Math.max(0,Math.min(maxDiem,Math.round(Number(e.target.value)||0)));render()}});
      rd.appendChild(inp);
      sum.appendChild(rd);
      if(dungDiem>0)sum.appendChild(dong('Trừ điểm','<span style="color:var(--la)">−'+vnd(dungDiem)+'</span>',1));
    }
    sum.appendChild(dong('<b style="font-size:16px">Phải trả</b>','<b style="font-size:18px">'+vnd(phaiTra)+'</b>',1));
    if(khach)sum.appendChild(dong('Tích 10% sau đơn','<span class="ch ok">+'+num(tichVe)+' Mi</span>',1));
    c2.appendChild(sum);
    var pay=E('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:14px'});
    ['Tiền mặt','Chuyển khoản'].forEach(function(h){
      pay.appendChild(E('button',{'class':'b'+(S.hinhThuc===h?' warn':''),onclick:function(){S.hinhThuc=h;render()}},esc(h)));
    });
    pay.appendChild(E('button',{'class':'b pri',style:'flex:1;justify-content:center',onclick:chotDon},'Thu tiền và ghi đơn'));
    c2.appendChild(pay);
  }
  g.appendChild(c2);
  m.appendChild(g);

  function dong(l,v,plain){
    var r=E('div',{'class':'rl'});
    r.appendChild(E('span',{'class':'nm',style:plain?'font-weight:400':''},l));
    r.appendChild(E('span',{'class':'num'},v));
    return r;
  }
  function themGio(p){
    for(var i=0;i<S.cart.length;i++)if(S.cart[i].id===p.id){
      if(S.cart[i].sl>=(p.tonKho||0))return toast('Không đủ tồn kho',true);
      S.cart[i].sl++;render();return;
    }
    S.cart.push({id:p.id,ten:p.ten,gia:p.giaBan||0,sl:1});render();
  }
  function chotDon(){
    if(!S.cart.length)return toast('Giỏ đang trống',true);
    if(!S.hinhThuc)return toast('Chọn tiền mặt hay chuyển khoản',true);
    var don={ma:uid('dh'),g:nowHM(),ngay:S.dayId,khachId:khach?khach.id:'',khachTen:khach?khach.ten:'',
      items:S.cart.map(function(i){return {id:i.id,ten:i.ten,gia:i.gia,sl:i.sl}}),
      tam:tam,dungDiem:dungDiem,phaiTra:phaiTra,hinhThuc:S.hinhThuc,nguoiBan:S.me.ten,misaXuat:false};
    var ds=(S.day.donHang||[]).concat([don]);
    var jobs=[patch('days/'+S.dayId,{donHang:ds,ngay:S.dayId})];
    S.cart.forEach(function(i){
      var p=pById(i.id);
      if(p)jobs.push(moveKho(p,-i.sl,'ban','',don.ma+(khach?' · '+khach.ten:' · khách lẻ')));
    });
    if(khach){
      var tx=(khach.miTx||[]).slice();
      if(dungDiem>0)tx.unshift({ngay:S.dayId,viec:'Dùng điểm trừ vào đơn',tu:'Bán hàng',diem:-dungDiem});
      if(tichVe>0)tx.unshift({ngay:S.dayId,viec:'Mua hàng '+vnd(phaiTra)+', tích 10%',tu:'Bán hàng',diem:tichVe});
      var dsu=(khach.donSu||[]).slice();
      dsu.unshift({ngay:S.dayId,loai:'hang',tomTat:S.cart.map(function(i){return i.ten+' ×'+i.sl}).join(', '),tien:phaiTra});
      jobs.push(patch('members/'+khach.id,{diemMi:Math.max(0,(khach.diemMi||0)-dungDiem+tichVe),miTx:tx.slice(0,80),donSu:dsu.slice(0,80)}));
    }
    Promise.all(jobs).then(function(){
      ghiNhatKy('Thu tiền đơn '+vnd(phaiTra)+(dungDiem?', dùng '+num(dungDiem)+' điểm Mi':''),S.me.ten,khach?khach.ten:'Khách lẻ');
      toast('Đã ghi đơn '+vnd(phaiTra)+', trừ kho và tích điểm');
      S.cart=[];S.dungDiem=0;S.hinhThuc=null;S.sellFor=null;render();
    }).catch(dbErr);
  }
}
function chonKhach(cb){
  var b=E('div');
  var s=E('input',{'class':'srch',placeholder:'Gõ tên, mã hội viên hoặc số điện thoại',style:'width:100%;margin-bottom:12px',oninput:draw});
  b.appendChild(s);var host=E('div');b.appendChild(host);
  function draw(){
    host.innerHTML='';
    var q=kd(s.value);
    S.members.filter(function(x){return !q||kd(x.ten).indexOf(q)>=0||kd(x.maHV).indexOf(q)>=0||String(x.sdt||'').indexOf(s.value)>=0}).slice(0,20).forEach(function(x){
      var r=E('div',{'class':'rl',style:'cursor:pointer',onclick:function(){closeModal();cb(x.id)}});
      r.appendChild(E('span',{'class':'nm'},esc(x.ten)+' <span class="mut">'+esc(x.sdt||'')+'</span>'));
      r.appendChild(E('span',{'class':'ch n'},num(x.diemMi||0)+' Mi'));
      host.appendChild(r);
    });
  }
  draw();
  modal('Chọn khách',b,[btn('Bán cho khách lẻ',function(){closeModal();cb('')}),btn('Đóng',closeModal)]);
  setTimeout(function(){s.focus()},30);
}

/* ========== 7. THE VA GIA HAN ========== */
function vCards(m){
  head(m,'Thẻ và gia hạn',null,[btn('Bán thẻ mới',function(){chonKhach(function(id){var x=mById(id);if(x)formThe(x);else toast('Cần chọn một hồ sơ',true)})},'pri')]);
  var sapHet=S.members.filter(function(x){var c=conNgay(x);return c!==null&&c<=21}).sort(function(a,b){return (conNgay(a)||0)-(conNgay(b)||0)});
  var chuaCo=S.members.filter(function(x){return !x.theHetHan});

  if(!ckCfg())m.appendChild(E('div',{'class':'warn'},'Chưa cài tài khoản nhận thanh toán.'));
  var cho=ckDangCho().sort(function(a,b){return a.trangThai===b.trangThai?(a.taoLuc<b.taoLuc?-1:1):(a.trangThai==='da_bao'?-1:1)});
  var cCk=E('div',{'class':'card',style:cho.length?'border-color:var(--vang)':''});
  cCk.appendChild(E('h3',null,'Gia hạn online chờ xác nhận tiền · '+cho.length));
  if(!cho.length)cCk.appendChild(E('div',{style:'color:var(--ink-3);font-size:14px'},'Không có yêu cầu nào đang chờ.'));
  cho.forEach(function(p){
    var tt=TT_CK[p.trangThai];
    var r=E('div',{'class':'rl',style:'flex-wrap:wrap'});
    r.appendChild(E('div',{style:'flex:1 1 240px;min-width:0'},
      '<div class="nm"><span class="ckma">'+esc(p.ma)+'</span> · '+esc(p.taoTen)+'</div>'+
      '<div style="font-size:12.5px;color:var(--ink-3);margin-top:2px">'+esc(tomTatCK(p))+(p.dungDiem?' · dùng '+num(p.dungDiem)+' điểm Mi':'')+' · tạo '+dmy(p.ngay)+'</div>'));
    r.appendChild(E('b',{'class':'num'},vnd(p.soTien)));
    r.appendChild(E('span',{'class':'ch '+tt.c},esc(tt.t)));
    r.appendChild(btn('Xem',function(){moPhieuCK(p)},'sm'));
    r.appendChild(btn('Đã nhận tiền',function(){xacNhanCK(p)},'sm pri'));
    cCk.appendChild(r);
  });
  m.appendChild(cCk);

  var c1=E('div',{'class':'card'});
  c1.appendChild(E('h3',null,'Bảng giá áp dụng từ 1/9/2026'));
  var rows=[];
  KY.forEach(function(k){
    var vc=GIA.vuoncao.ky[k.m],vm=GIA.vienman.ky[k.m];
    var re=k.m===12?'<span class="ch ok">rẻ hơn 1.188.000đ</span>':'';
    rows.push([k.t+' '+re,
      {r:1,h:'<b class="num">'+vnd(vc)+'</b>'+(k.m>1?'<br><span class="mut num" style="font-size:11.5px;color:var(--ink-3)">'+vnd(vc/k.m)+' mỗi tháng</span>':'')},
      {r:1,h:'<b class="num">'+vnd(vm)+'</b>'+(k.m>1?'<br><span class="mut num" style="font-size:11.5px;color:var(--ink-3)">'+vnd(vm/k.m)+' mỗi tháng</span>':'')}]);
  });
  c1.appendChild(tbl(['Kỳ hạn',{t:'Thẻ Vươn Cao',r:1},{t:'Thẻ Viên Mãn và U100',r:1}],rows));
  m.appendChild(c1);

  var c2=E('div',{'class':'card'});c2.appendChild(E('h3',null,'Thẻ sắp hết và đã hết hạn · '+sapHet.length));
  if(!sapHet.length)c2.appendChild(E('div',{style:'color:var(--ink-3);font-size:14px'},'Không có thẻ nào sắp hết trong 21 ngày tới.'));
  var nhomNha={};
  sapHet.forEach(function(x){var k=x.nhaTen||('__'+x.id);(nhomNha[k]=nhomNha[k]||[]).push(x)});
  Object.keys(nhomNha).forEach(function(k){
    var arr=nhomNha[k];
    if(arr.length>1){
      c2.appendChild(E('div',{style:'font-size:12px;color:var(--vang);font-weight:700;margin:10px 0 2px'},
        esc(k)+' · '+arr.length+' thẻ'));
    }
    arr.forEach(function(x){
      var t=tinhTrangThe(x);
      var r=E('div',{'class':'rl'});
      r.appendChild(E('span',{'class':'nm',style:'cursor:pointer',onclick:function(){go('member',x.id)}},esc(x.ten)+' <span class="mut">'+esc(x.sdt||'')+'</span>'));
      r.appendChild(E('span',{'class':'ch '+t.c},esc(t.t)));
      r.appendChild(btn('Gia hạn',function(){formThe(x,true)},'sm pri'));
      c2.appendChild(r);
    });
  });
  m.appendChild(c2);

  if(chuaCo.length){
    var c3=E('div',{'class':'card'});c3.appendChild(E('h3',null,'Chưa có thẻ · '+chuaCo.length));
    chuaCo.slice(0,20).forEach(function(x){
      var r=E('div',{'class':'rl'});
      r.appendChild(E('span',{'class':'nm',style:'cursor:pointer',onclick:function(){go('member',x.id)}},esc(x.ten)));
      r.appendChild(btn('Bán thẻ',function(){formThe(x)},'sm'));
      c3.appendChild(r);
    });
    m.appendChild(c3);
  }

  var daDong=S.payments.filter(function(p){return p.trangThai==='xong'||p.trangThai==='huy'});
  var cLs=E('div',{'class':'card'});
  cLs.appendChild(E('h3',null,'Lịch sử gia hạn online · '+daDong.length));
  cLs.appendChild(bangCK(daDong.slice(0,40),true));
  if(S.dl&&S.payments.length)cLs.appendChild(E('div',{style:'margin-top:12px'},'')).appendChild(btn('Xuất file lịch sử',xuatCSVCK));
  m.appendChild(cLs);
}
function vMi(m){
  head(m,'Điểm Mi',null,[S.dl?btn('Xuất sổ điểm',function(){xuatCSVMi()},'pri'):null]);

  var tongDiem=0,coDiem=0,thangNay=ymd().slice(0,7),tichThang=0,dungThang=0,soGiaoDich=0;
  S.members.forEach(function(x){
    var d=x.diemMi||0;tongDiem+=d;if(d>0)coDiem++;
    (x.miTx||[]).forEach(function(tx){
      soGiaoDich++;
      if(tx.ngay&&tx.ngay.slice(0,7)===thangNay){
        if(tx.diem>0)tichThang+=tx.diem;else dungThang+=-tx.diem;
      }
    });
  });
  var k=E('div',{'class':'kpis'});
  k.appendChild(kpi('Tổng điểm đang giữ',num(tongDiem),coDiem+' hội viên có điểm',function(){}));
  k.appendChild(kpi('Tích trong tháng',num(tichThang),'điểm Mi',function(){}));
  k.appendChild(kpi('Đã dùng trong tháng',num(dungThang),'điểm Mi',function(){}));
  k.appendChild(kpi('Tổng giao dịch',num(soGiaoDich),'từ trước tới nay',function(){},false));
  m.appendChild(k);

  var top=S.members.filter(function(x){return (x.diemMi||0)>0}).sort(function(a,b){return (b.diemMi||0)-(a.diemMi||0)});
  var c1=E('div',{'class':'card'});
  c1.appendChild(E('h3',null,'Hội viên đang giữ điểm · '+top.length));
  var s=E('input',{'class':'srch',placeholder:'Tìm theo tên, mã hội viên hoặc số điện thoại',style:'margin-bottom:10px',oninput:function(e){S.q=e.target.value;drawTop()}});
  c1.appendChild(s);
  var hostTop=E('div');c1.appendChild(hostTop);
  m.appendChild(c1);
  function drawTop(){
    hostTop.innerHTML='';
    var q=kd(S.q);
    var list=top.filter(function(x){return !q||kd(x.ten).indexOf(q)>=0||kd(x.maHV).indexOf(q)>=0||String(x.sdt||'').indexOf(S.q)>=0}).slice(0,30);
    if(!list.length){hostTop.appendChild(E('div',{'class':'empty'},'<b>Chưa có ai giữ điểm</b>'));return}
    list.forEach(function(x){
      var r=E('div',{'class':'rl',style:'cursor:pointer',onclick:function(){go('member',x.id)}});
      r.appendChild(E('span',{'class':'nm'},esc(x.ten)+(x.nhaTen?' <span class="fam" style="margin-left:6px">'+esc(x.nhaTen)+'</span>':'')));
      r.appendChild(E('span',{style:'font-weight:800',class:'num'},num(x.diemMi||0)));
      hostTop.appendChild(r);
    });
  }
  drawTop();

  var giaoDich=[];
  S.members.forEach(function(x){(x.miTx||[]).forEach(function(tx){giaoDich.push({x:x,tx:tx})})});
  giaoDich.sort(function(a,b){return a.tx.ngay<b.tx.ngay?1:a.tx.ngay>b.tx.ngay?-1:0});
  var c2=E('div',{'class':'card'});
  c2.appendChild(E('h3',null,'Giao dịch gần đây toàn quầy'));
  if(!giaoDich.length)c2.appendChild(E('div',{'class':'empty'},'<b>Chưa có giao dịch nào</b>'));
  else c2.appendChild(tbl(['Ngày','Hội viên','Việc đã sinh ra điểm','Sinh từ',{t:'Điểm',r:1}],giaoDich.slice(0,60).map(function(z){
    return {cells:[{h:dmy(z.tx.ngay)},{h:'<b>'+esc(z.x.ten)+'</b>'},{h:esc(z.tx.viec)},{h:esc(z.tx.tu)},
      {r:1,h:'<span class="num" style="color:'+(z.tx.diem<0?'var(--do)':'var(--la)')+'">'+(z.tx.diem>0?'+':'')+num(z.tx.diem)+'</span>'}],
      __click:function(){go('member',z.x.id)}};
  })));
  m.appendChild(c2);
}
function xuatCSVMi(){
  var rows=[['Sổ điểm Mi toàn quầy, xuất ngày',dmy(ymd())],[],['Ngày','Hội viên','Số điện thoại','Việc đã sinh ra điểm','Sinh từ','Điểm']];
  S.members.forEach(function(x){(x.miTx||[]).forEach(function(tx){
    rows.push([tx.ngay,x.ten,x.sdt||'',tx.viec,tx.tu,tx.diem]);
  })});
  taiFile('so-diem-mi-'+ymd()+'.csv',csv(rows));
}
function formThe(x,giaHan){
  var loai=x.theLoai||'vienman',ky=12;
  var b=E('div');
  function draw(){
    b.innerHTML='';
    b.appendChild(E('div',{'class':'lbl',style:'margin-top:0'},'Loại thẻ'));
    var f1=E('div',{'class':'fil'});
    ['vuoncao','vienman','u100'].forEach(function(k){
      f1.appendChild(E('button',{'class':loai===k?'on':'',onclick:function(){loai=k;draw()}},esc(GIA[k].ten+' · '+vnd(GIA[k].thang))));
    });
    b.appendChild(f1);
    b.appendChild(E('div',{'class':'lbl'},'Kỳ hạn'));
    var gr=E('div',{style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px'});
    KY.forEach(function(k){
      var gia=GIA[loai].ky[k.m];
      var on=ky===k.m;
      var el=E('button',{style:'text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;background:'+(on?'var(--la-soft)':'var(--surface)')+';border:'+(on?'2px solid var(--la)':'1px solid var(--line)'),
        onclick:function(){ky=k.m;draw()}});
      el.innerHTML='<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-3)">'+esc(k.t)+'</div>'+
        '<div class="num" style="font-size:16px;font-weight:800;margin:3px 0 1px">'+vnd(gia)+'</div>'+
        (k.m===12?'<div style="font-size:10.5px;color:var(--la);font-weight:700">rẻ hơn 1.188.000đ</div>':'<div style="font-size:10.5px;color:var(--ink-3)">&nbsp;</div>');
      gr.appendChild(el);
    });
    b.appendChild(gr);
    var gia=GIA[loai].ky[ky];
    var batDau=(giaHan&&x.theHetHan&&conNgay(x)>0)?x.theHetHan:S.dayId;
    var het=addMonths(batDau,ky);
    b.appendChild(E('div',{'class':'warn',style:'margin:14px 0 0'},
      'Thẻ chạy từ <b>'+dmy(batDau)+'</b> đến <b>'+dmy(het)+'</b>.'));
  }
  draw();
  modal((giaHan?'Gia hạn thẻ · ':'Bán thẻ · ')+x.ten,b,[btn('Thôi',closeModal),btn('Chốt thẻ và thu tiền',function(){
    var gia=GIA[loai].ky[ky];
    var batDau=(giaHan&&x.theHetHan&&conNgay(x)>0)?x.theHetHan:S.dayId;
    var het=addMonths(batDau,ky);

/* ========== 7b. GIA HAN ONLINE: chuyen khoan QR ========== */
var NGAN_HANG=[
  {bin:'970436',t:'Vietcombank'},{bin:'970418',t:'BIDV'},{bin:'970415',t:'VietinBank'},{bin:'970405',t:'Agribank'},
  {bin:'970407',t:'Techcombank'},{bin:'970422',t:'MB Bank'},{bin:'970416',t:'ACB'},{bin:'970432',t:'VPBank'},
  {bin:'970423',t:'TPBank'},{bin:'970403',t:'Sacombank'},{bin:'970441',t:'VIB'},{bin:'970443',t:'SHB'},
  {bin:'970437',t:'HDBank'},{bin:'970448',t:'OCB'},{bin:'970426',t:'MSB'},{bin:'970440',t:'SeABank'},
  {bin:'970449',t:'LPBank'},{bin:'970431',t:'Eximbank'}
];
var TT_CK={cho:{t:'Chờ chuyển khoản',c:'n'},da_bao:{t:'Khách báo đã chuyển',c:'wn'},xong:{t:'Đã gia hạn',c:'ok'},huy:{t:'Đã huỷ',c:'bd'}};
function tenNH(bin){for(var i=0;i<NGAN_HANG.length;i++)if(NGAN_HANG[i].bin===bin)return NGAN_HANG[i].t;return 'Ngân hàng mã '+bin}
function ckCfg(){var c=S.cfg||{};return (c.nhBin&&c.nhStk)?c:null}
function tenKy(m){for(var i=0;i<KY.length;i++)if(KY[i].m===m)return KY[i].t;return m+' tháng'}
function tlv(id,v){v=String(v);return id+pad(v.length)+v}
function crc16(s){
  var c=0xFFFF;
  for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}
  return ('0000'+c.toString(16).toUpperCase()).slice(-4);
}
function vietQR(bin,stk,tien,noiDung){
  var tk=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',stk))+tlv('02','QRIBFTTA');
  var s=tlv('00','01')+tlv('01','12')+tlv('38',tk)+tlv('53','704')+
    (tien>0?tlv('54',String(Math.round(tien))):'')+tlv('58','VN')+tlv('62',tlv('08',noiDung))+'6304';
  return s+crc16(s);
}
function maCK(){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(6),s='';
  crypto.getRandomValues(r);for(var i=0;i<6;i++)s+=a[r[i]%a.length];
  return 'QSK'+s;
}
function veQR(host,text){
  host.innerHTML='';
  if(!window.QRCode){host.appendChild(E('div',{style:'font-size:13px;color:var(--do);max-width:240px'},'Máy này chưa hiện được mã QR. Chuyển khoản theo thông tin bên cạnh, ghi đúng nội dung.'));return}
  var box=E('div',{'class':'qrbox'});host.appendChild(box);
  try{new QRCode(box,{text:text,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
  catch(e){box.textContent='Không tạo được mã QR'}
}
function chepVao(t){
  try{navigator.clipboard.writeText(t).then(function(){toast('Đã chép '+t)},function(){toast('Chưa chép được, gõ tay giúp nhé',true)})}
  catch(e){toast('Chưa chép được, gõ tay giúp nhé',true)}
}
function ckCuaHv(id){return S.payments.filter(function(p){return p.taoBoi===id||(p.dong||[]).some(function(d){return d.memberId===id})})}
function ckDangMo(id){return S.payments.filter(function(p){return p.taoBoi===id&&(p.trangThai==='cho'||p.trangThai==='da_bao')})[0]||null}
function ckDangCho(){return S.payments.filter(function(p){return p.trangThai==='cho'||p.trangThai==='da_bao'})}
function tomTatCK(p){return (p.dong||[]).map(function(d){return GIA[d.loai].ten.replace('Thẻ ','')+' '+tenKy(d.ky)+' cho '+d.ten}).join(' · ')}

/* Phieu thanh toan: ma QR, thong tin chuyen khoan, trang thai */

function apDungCK(p,ai){
  return docRef('payments/'+p.ma).get().then(function(s){
    if(!s.exists)throw {msg:'Không thấy yêu cầu '+p.ma};
    var cur=Object.assign({},s.data(),{ma:p.ma});
    if(cur.trangThai==='xong')throw {msg:'Yêu cầu này đã gia hạn rồi'};
    if(cur.trangThai==='huy')throw {msg:'Yêu cầu này đã huỷ'};
    var payer=mById(cur.taoBoi);
    if(!payer)throw {msg:'Không thấy hồ sơ người mua'};
    if(cur.dungDiem>0&&(payer.diemMi||0)<cur.dungDiem)
      throw {msg:payer.ten+' giờ chỉ còn '+num(payer.diemMi||0)+' điểm Mi, không đủ '+num(cur.dungDiem)+'. Huỷ yêu cầu này để khách tạo lại.'};
    var hom=ymd(),luc=new Date().toISOString();
    var patches={},creates={},ketQua=[];
    function P(id){return patches[id]=patches[id]||{}}
    var nha=payer.nhaTen||'';
    if(!nha&&(cur.dong||[]).some(function(d){return d.moi})){nha='Nhà '+payer.ten;P(payer.id).nhaTen=nha}
    (cur.dong||[]).forEach(function(d){
      var y=d.memberId?mById(d.memberId):null;
      var id=y?y.id:uid('hv');
      var conHan=y&&y.theHetHan&&daysBetween(hom,y.theHetHan)>0;
      var batDau=conHan?y.theHetHan:hom;
      var het=addMonths(batDau,d.ky);
      var su={ngay:hom,loai:'the',tomTat:(y&&y.theHetHan?'Gia hạn ':'Mua ')+GIA[d.loai].ten+' '+d.ky+' tháng, chuyển khoản '+cur.ma,tien:d.gia};
      if(y)Object.assign(P(id),{theLoai:d.loai,theBatDau:batDau,theHetHan:het,theKy:d.ky,donSu:[su].concat(y.donSu||[]).slice(0,80)});
      else creates[id]={maHV:maHVMoi(null,Object.keys(creates).length),ten:d.ten,sdt:'',namSinh:d.namSinh||'',theLoai:d.loai,theBatDau:batDau,theHetHan:het,theKy:d.ky,
        nhaTen:nha,quanHe:'',diemMi:0,doLan:[],tapLuc:[],miTx:[],donSu:[su],
        ghiChu:[{g:luc,ai:ai,t:'Mở hồ sơ khi '+payer.ten+' mua thẻ qua mã '+cur.ma}],taoLuc:luc};
      ketQua.push({memberId:id,ten:d.ten,loai:d.loai,ky:d.ky,tu:batDau,den:het});
    });
    if(cur.dungDiem>0){
      var pp=P(payer.id);
      pp.diemMi=Math.max(0,(payer.diemMi||0)-cur.dungDiem);
      pp.miTx=[{ngay:hom,viec:'Dùng điểm gia hạn thẻ, mã '+cur.ma,tu:'Gia hạn thẻ',diem:-cur.dungDiem}].concat(payer.miTx||[]).slice(0,80);
    }
    var don={ma:cur.ma,g:nowHM(),ngay:hom,khachId:payer.id,khachTen:payer.ten,
      items:(cur.dong||[]).map(function(d){return {id:'the-'+d.loai,ten:GIA[d.loai].ten+' '+d.ky+' tháng · '+d.ten,gia:d.gia,sl:1}}),
      tam:cur.tam,dungDiem:cur.dungDiem,phaiTra:cur.soTien,hinhThuc:cur.soTien>0?'Chuyển khoản QR':'Điểm Mi',nguoiBan:ai,laThe:true};
    return docRef('days/'+hom).get().then(function(ds){
      var dd=ds.exists?ds.data():{};
      var jobs=[patch('days/'+hom,{donHang:(dd.donHang||[]).concat([don]),ngay:hom})];
      Object.keys(patches).forEach(function(id){jobs.push(patch('members/'+id,patches[id]))});
      Object.keys(creates).forEach(function(id){jobs.push(save('members/'+id,creates[id]).then(function(){kiemTraMa(id)}))});
      return Promise.all(jobs);
    }).then(function(){
      return patch('payments/'+cur.ma,{trangThai:'xong',xacNhanBoi:ai,xacNhanLuc:luc,ketQua:ketQua});
    }).then(function(){
      ghiNhatKy('Gia hạn qua chuyển khoản '+cur.ma+', '+vnd(cur.soTien)+(cur.dungDiem?', dùng '+num(cur.dungDiem)+' điểm Mi':''),ai,payer.ten);
      return ketQua;
    });
  });
}

  thucpham:{t:'Thực phẩm thông thường',cb:'Bản tự công bố sản phẩm',bb:['congbo']},
  ttbyt:{t:'Trang thiết bị y tế',cb:'Bản công bố tiêu chuẩn áp dụng',bb:['congbo']},

function hoSoThieu(p){
  if(!loaiHang(p))return [];
  var co={};(p.taiLieu||[]).forEach(function(t){co[t.loai]=t});

  LOAI_TL.forEach(function(l){

  return thieu;

function moveKho(p,delta,loai,lyDo,ref,nguoi){
  var truoc=p.tonKho||0;
  var sau=Math.max(0,truoc+delta);
  var tk=(p.theKho||[]).slice(0,399);
  tk.unshift({luc:new Date().toISOString(),ngay:S.dayId,g:nowHM(),loai:loai,
    sl:delta,truoc:truoc,sau:sau,ai:(S.me&&S.me.ten)||'?',ly:lyDo||'',ref:ref||'',nguoi:nguoi||''});
  return patch('products/'+p.id,{tonKho:sau,theKho:tk});
}

      modeBar.appendChild(E('button',{'class':kkMode==='chenh'?'on':'',onclick:function(){kkMode='chenh';draw()}},'Số cộng trừ (+/-)'));
      b.appendChild(modeBar);
      var ff2=E('div',{'class':'f',style:'margin-top:12px'});
      if(kkMode==='dem'){
        ff2.innerHTML='<div><label>Số đếm được thực tế, máy đang ghi '+(p.tonKho||0)+'</label><input id="dc_n" type="number" value="'+(p.tonKho||0)+'"></div>'+

      }

    } else {

      if(d===0){closeModal();return toast('Không có chênh lệch')}

      ghiNhatKy(LOAI_KHO[loai].t+' '+n+' '+p.ten+(ng?' · '+ng:'')+' · '+ly,S.me.ten,p.ten);
      closeModal();toast('Đã ghi vào thẻ kho');
    }).catch(dbErr);
  },'pri')]);
}

/* ========== KHO TEP: excel, word, pdf, anh ========== */
var CHUNK=150000;
var CHO_PHEP=['pdf','doc','docx','xls','xlsx','csv','ppt','pptx','txt','rtf','odt','ods','png','jpg','jpeg','webp','gif','heic','heif','bmp'];
var TOI_DA=6*1024*1024;

function duoiTep(n){var i=String(n).lastIndexOf('.');return i<0?'':String(n).slice(i+1).toLowerCase()}
function laAnh(mime,ten){return /^image\//.test(mime||'')||['png','jpg','jpeg','webp','gif'].indexOf(duoiTep(ten))>=0}

function nenAnh(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('doc loi'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){res(fr.result)};
      img.onload=function(){
        var W=1600,w=img.width,h=img.height;
        if(w<=W&&h<=W&&fr.result.length<900000)return res(fr.result);
        var s=Math.min(1,W/Math.max(w,h));
        var cv=document.createElement('canvas');
        cv.width=Math.round(w*s);cv.height=Math.round(h*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.78));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function docTep(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('doc loi'))};
    fr.onload=function(){res(fr.result)};
    fr.readAsDataURL(file);
  });
}
function tachChunk(s){var a=[];for(var i=0;i<s.length;i+=CHUNK)a.push(s.slice(i,i+CHUNK));return a}

function luuTep(file,thuoc,nhan,onTien){
  var duoi=duoiTep(file.name);
  if(CHO_PHEP.indexOf(duoi)<0)return Promise.reject(new Error('chưa nhận loại tệp .'+duoi));
  if(file.size>TOI_DA)return Promise.reject(new Error('tệp '+kichTep(file.size)+', quá 6 MB'));
  var pre=laAnh(file.type,file.name)?nenAnh(file):docTep(file);
  return pre.then(function(dataUrl){
    var parts=tachChunk(dataUrl);
    if(parts.length>60)throw new Error('tệp quá lớn');
    var fid=uid('tep'),i=0;
    function ghi(){
      if(i>=parts.length)return Promise.resolve();
      var k=i++;
      return docRef('files/'+fid+'/data/'+k).set({b64:parts[k]}).then(function(){
        if(onTien)onTien(Math.round(i/parts.length*100));
        return ghi();
      });
    }
    return ghi().then(function(){
      return save('files/'+fid,{ten:file.name,mime:file.type||'',kich:file.size,
        chunks:parts.length,anh:laAnh(file.type,file.name),thuoc:thuoc||'',nhan:nhan||'',
        ai:tenNguoiDung(),khach:!S.me,luc:new Date().toISOString()}).then(function(){return fid});
    });
  });
}
function docTepDay(fid){
  return docRef('files/'+fid).get().then(function(s){
    if(!s.exists)throw new Error('Không thấy tệp');
    var meta=s.data();
    var jobs=[];
    for(var i=0;i<meta.chunks;i++)jobs.push(docRef('files/'+fid+'/data/'+i).get());
    return Promise.all(jobs).then(function(ss){
      var b64='';ss.forEach(function(x){b64+=(x.data()||{}).b64||''});
      return {meta:meta,dataUrl:b64};
    });
  });
}
function urlToBlob(u){
  var i=u.indexOf(',');var head=u.slice(0,i),body=u.slice(i+1);
  var mime=(head.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
  var bin=atob(body);var arr=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
  return new Blob([arr],{type:mime});
}
function xoaTep(fid,chunks){
  var jobs=[docRef('files/'+fid).delete()];
  for(var i=0;i<(chunks||0);i++)jobs.push(docRef('files/'+fid+'/data/'+i).delete());
  return Promise.all(jobs);
}
var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var napPdfHua=null;
function napScript(src){
  return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('Không tải được bộ đọc PDF'))};document.head.appendChild(s)});
}
function napPDF(){
  if(window.pdfjsLib&&window.pdfjsWorker)return Promise.resolve(window.pdfjsLib);
  if(!napPdfHua)napPdfHua=napScript(PDFJS_URL+'pdf.min.js').then(function(){return napScript(PDFJS_URL+'pdf.worker.min.js')}).then(function(){return window.pdfjsLib});
  return napPdfHua;
}
function urlToBytes(u){
  var bin=atob(u.slice(u.indexOf(',')+1));var arr=new Uint8Array(bin.length);
  for(var j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);

function xemTep(r){

  }

  var nhoBtn=btn('Thu nhỏ',function(){if(zoom>0.6){zoom-=0.25;ve()}},'sm');
  var toBtn=btn('Phóng to',function(){if(zoom<3){zoom+=0.25;ve()}},'sm');

  nutCuoi.forEach(function(b){k.bar.appendChild(b)});
  k.info.textContent='Đang mở...';
  function ve(){
    if(!pdf)return;
    k.info.textContent=pdf.numPages+' trang · '+Math.round(zoom*100)+'%';
    k.body.innerHTML='';
    var dpr=window.devicePixelRatio||1,chuoi=Promise.resolve();
    for(var i=1;i<=pdf.numPages;i++){(function(i){
      var cv=E('canvas',{'aria-label':'Trang '+i});k.body.appendChild(cv);

        cv.width=vp.width;cv.height=vp.height;
        cv.style.width=Math.round(vp.width/dpr)+'px';cv.style.height=Math.round(vp.height/dpr)+'px';
        return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      });
    })(i)}
    chuoi.catch(function(){toast('Có trang không hiển thị được',true)});
  }
  napPDF().then(function(lib){
    return lib.getDocument({data:urlToBytes(r.dataUrl)}).promise;
  }).then(function(d){
    pdf=d;
    var rong=k.body.clientWidth-32;
    return d.getPage(1).then(function(pg){
      var w=pg.getViewport({scale:1}).width;
      zoom=Math.max(0.6,Math.min(1.6,rong/w));
      ve();
    });
  }).catch(function(e){
    k.info.textContent='';
    k.body.innerHTML='';
    k.body.appendChild(E('div',{'class':'xem-loi'},'<b>Chưa mở được tệp này để xem</b><span>'+esc((e&&e.message)||'')+'</span>'));

function nutTaiLen(thuoc,nhan,xong,lon){
  var wrap=E('div');
  var inp=E('input',{type:'file',multiple:'',style:'display:none',accept:'.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx,.txt,.rtf,.odt,.ods,.png,.jpg,.jpeg,.webp,.gif,.heic,.heif,.bmp,image/*'});
  var bar=E('div',{style:'display:none;height:6px;border-radius:4px;background:var(--surface-2);margin-top:10px;overflow:hidden'});
  var fill=E('div',{style:'height:100%;width:0;background:var(--sky);transition:width .2s'});bar.appendChild(fill);
  var b;
  if(lon){
    b=E('button',{'class':'drop',type:'button',onclick:function(){inp.click()}},'<b>Chọn tệp để tải lên</b><span>PDF · Word · Excel · Ảnh · tối đa 6 MB mỗi tệp</span>');
    b.addEventListener('dragover',function(e){e.preventDefault();b.classList.add('on')});
    b.addEventListener('dragleave',function(){b.classList.remove('on')});
    b.addEventListener('drop',function(e){e.preventDefault();b.classList.remove('on');if(e.dataTransfer)chay(e.dataTransfer.files)});
  } else b=btn('Chọn tệp từ máy',function(){inp.click()},'pri');
  var nhanGoc=b.innerHTML;
  function chay(files){
    files=Array.prototype.slice.call(files||[]);if(!files.length)return;
    b.disabled=true;bar.style.display='block';
    var i=0,ok=0,goi=uid('tv'),ids=[];
    function tiep(){
      if(i>=files.length){
        b.disabled=false;b.innerHTML=nhanGoc;bar.style.display='none';fill.style.width='0';inp.value='';
        if(ok)toast('Đã tải lên '+ok+' tệp');
        if(lon&&xong)xong(goi,ids);
        return;
      }
      var f=files[i++];
      b.innerHTML=lon?'<b>Đang tải '+i+'/'+files.length+'</b><span>'+esc(f.name)+'</span>':'Đang tải lên...';
      fill.style.width='0';
      luuTep(f,thuoc,lon?goi:nhan,function(pc){fill.style.width=pc+'%'}).then(function(fid){
        ok++;ids.push(fid);if(!lon&&xong)xong(fid,f);tiep();
      }).catch(function(e){toast(f.name+': '+((e&&e.message)||'không tải lên được'),true);tiep()});
    }
    tiep();
  }
  inp.addEventListener('change',function(){chay(inp.files)});
  wrap.appendChild(inp);wrap.appendChild(b);wrap.appendChild(bar);
  return wrap;
}

function capMatKhauTam(x,cu,veLai){

  b.innerHTML='<div class="rl" style="padding-top:0"><span class="nm" style="font-weight:400;color:var(--ink-3)">Số đăng nhập</span><b class="num">'+esc(x.sdt)+'</b></div>'+
    '<div><label for="mkt_1">Mật khẩu tạm</label><input id="mkt_1" class="pin" inputmode="numeric" maxlength="4" autocomplete="off" value="'+goiY+'"></div>';
  modal(cu?'Cấp mật khẩu tạm · '+x.ten:'Tạo tài khoản · '+x.ten,b,[btn('Thôi',closeModal),btn(cu?'Cấp mật khẩu':'Tạo tài khoản',function(){

        k.appendChild(E('div',{'class':'mabox',style:'margin-top:10px'},'<span>Mật khẩu tạm</span><b>'+esc(pw)+'</b>'));
        modal('Đã '+(cu?'cấp mật khẩu':'tạo tài khoản')+' · '+x.ten,k,[btn('Chép mật khẩu',function(){chepVao(pw)}),btn('Xong',function(){closeModal();if(veLai)veLai()},'pri')]);

function formDoiMK(batBuoc){
  var b=E('div',{'class':'f'});
  b.innerHTML=(batBuoc?'':'<div><label for="mk_cu">Mật khẩu hiện tại</label><input id="mk_cu" type="password" autocomplete="current-password"></div>')+
    '<div><label for="mk_1">Mật khẩu mới, 4 số</label><input id="mk_1" type="password" class="pin" inputmode="numeric" maxlength="4" autocomplete="new-password"></div>'+
    '<div><label for="mk_2">Nhập lại mật khẩu mới</label><input id="mk_2" type="password" class="pin" inputmode="numeric" maxlength="4" autocomplete="new-password"></div>';

  if(!batBuoc)act.push(btn('Thôi',closeModal));
  act.push(btn('Lưu mật khẩu',function(){
    var p1=$('#mk_1').value,p2=$('#mk_2').value,pc=$('#mk_cu')?$('#mk_cu').value:'';

    var sdt=S.customer.id;
    docRef('customers/'+sdt).get().then(function(s){
      if(!s.exists)throw {msg:'Không thấy tài khoản'};
      var c=s.data();
      var kt=batBuoc?Promise.resolve(true):hashPw(pc,c.salt).then(function(hh){return hh===c.hash});
      return kt.then(function(ok){
        if(!ok)throw {msg:'Mật khẩu hiện tại không đúng'};

  modal(batBuoc?'Đặt mật khẩu mới':'Đổi mật khẩu',b,act);

      act.appendChild(btn(f.anh?'Xem':'Tải về',function(){
        ghiNhatKy('Mở tệp '+f.ten,tenNguoiDung(),'');moTep(f.id);
      },'sm'));
      if(S.me||f.khach)act.appendChild(btn('Xoá',function(){
        confirmBox('Xoá tệp','Xoá '+f.ten+'?',function(){
          xoaTep(f.id,f.chunks).then(function(){

          }).catch(dbErr);
        },'Xoá');
      },'sm dg'));
      r.appendChild(act);
      host.appendChild(r);
    });
  }).catch(function(e){host.innerHTML='';host.appendChild(E('div',{'class':'empty'},'<b>Chưa tải được danh sách tệp</b>'));dbErr(e)});

var TRANG_THAI_UV={
  khao_sat:{t:'Đang khảo sát',c:'n'}, phong_van:{t:'Đang phỏng vấn',c:'wn'},
  dao_tao:{t:'Đang đào tạo',c:'wn'}, thu_nghiem:{t:'Đang thử nghiệm',c:'wn'},
  da_ky:{t:'Đã ký, đang vận hành',c:'ok'}, tu_choi:{t:'Đã dừng',c:'bd'}
};
function uvById(id){for(var i=0;i<S.candidates.length;i++)if(S.candidates[i].id===id)return S.candidates[i];return null}
function uvXongBuoc(uv){var qt=uv.quyTrinh||{};var n=0;QUY_TRINH.forEach(function(q){if(qt[q.k]&&qt[q.k].xong)n++});return n}
function uvDuChanDung(uv){
  var cd=uv.chanDung||{},kp=uv.khongPhuHop||{};
  var okAll=CHAN_DUNG.every(function(c){return !!cd[c.k]});
  var noBad=KHONG_PHU_HOP.every(function(k){return !kp[k.k]});
  return okAll&&noBad;
}
function uvDuTieuChuan(uv){var tc=uv.tieuChuan||{};return TIEU_CHUAN.every(function(t){return !!tc[t.k]})}
function uvDaThiDat(uv){return !!(uv.quyTrinh&&uv.quyTrinh.daoTao&&uv.quyTrinh.daoTao.ketQua==='dat')}
function uvDuNhuongQuyen(uv){return uvDuChanDung(uv)&&uvDuTieuChuan(uv)&&uvDaThiDat(uv)}

  head(m,'Điểm quầy mẫu',null,[btn('+ Thêm ứng viên',function(){formUngVien(null)},'pri')]);

  var duNQ=S.candidates.filter(uvDuNhuongQuyen).length;
  var dangDT=S.candidates.filter(function(x){return x.trangThai==='dao_tao'}).length;
  var daKy=S.candidates.filter(function(x){return x.trangThai==='da_ky'}).length;
  var k=E('div',{'class':'kpis'});
  k.appendChild(kpi('Đang theo dõi',S.candidates.length,'ứng viên',function(){}));

  k.appendChild(kpi('Đang đào tạo',dangDT,'chưa thi hoặc chưa đạt',function(){}));
  k.appendChild(kpi('Đã ký, đang vận hành',daKy,'điểm',function(){}));
  m.appendChild(k);

  var fils=[['all','Tất cả'],['khao_sat','Khảo sát'],['phong_van','Phỏng vấn'],['dao_tao','Đào tạo'],['thu_nghiem','Thử nghiệm'],['da_ky','Đã ký'],['tu_choi','Đã dừng']];
  var fb=E('div',{'class':'fil'});
  fils.forEach(function(f){fb.appendChild(E('button',{'class':(S.filter===f[0]||(S.filter==='all'&&f[0]==='all'))?'on':'',onclick:function(){S.filter=f[0];render()}},esc(f[1])))});
  m.appendChild(fb);

  var list=S.candidates.filter(function(x){return S.filter==='all'||x.trangThai===S.filter});

  if(!list.length)c.appendChild(E('div',{'class':'empty'},'<b>Chưa có ứng viên nào</b>'));
  else c.appendChild(tbl(['Ứng viên','Khu vực','Bước hiện tại','Trạng thái','Đủ tiêu chuẩn'],list.map(function(x){
    var buoc=uvXongBuoc(x);
    var dots=QUY_TRINH.map(function(q,i){return '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;background:'+(i<buoc?'var(--la)':'var(--line-2)')+'"></span>'}).join('');
    var tt=TRANG_THAI_UV[x.trangThai]||{t:x.trangThai,c:'n'};
    var du=uvDuNhuongQuyen(x);
    return {cells:[{h:'<b>'+esc(x.ten)+'</b>'+(x.sdt?'<br><span style="font-size:11.5px;color:var(--ink-3)" class="num">'+esc(x.sdt)+'</span>':'')},
      {h:esc(x.khuVuc||x.diaChi||'')},
      {h:dots+'<div style="font-size:11px;color:var(--ink-3);margin-top:4px">'+buoc+'/6 bước</div>'},
      {h:'<span class="ch '+tt.c+'">'+esc(tt.t)+'</span>'},
      {h:du?'<span class="ch ok">Đủ tiêu chuẩn</span>':'<span class="ch n">Chưa đủ</span>'}],
      __click:function(){go('ungvien',x.id)}};
  })));
  m.appendChild(c);
}
